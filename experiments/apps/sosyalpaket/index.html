<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3b82">
<link rel="manifest" href="manifest.webmanifest">
<title>SosyalPaket</title>
<style>
:root{--navy:#0f3b82;--blue:#2563eb;--bg:#f5f7fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--green:#067647;--amber:#b54708;--danger:#b42318;--shadow:0 8px 30px #1018280d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}.app{min-height:100vh}.top{position:sticky;top:0;z-index:60;height:64px;background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand b{font-size:20px}.badge{font-size:12px;padding:6px 9px;border-radius:999px;background:#ecfdf3;color:var(--green);font-weight:800}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1280px;margin:auto}.side{position:sticky;top:64px;height:calc(100vh - 64px);padding:18px 12px;border-right:1px solid var(--line);background:#fff}.side button,.bottomnav button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-weight:800}.side button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:12px;margin-bottom:5px}.side button.on{background:#eef4ff;color:var(--navy)}.main{padding:24px 24px 110px;max-width:1000px;width:100%;margin:auto}.view{display:none}.view.on{display:block}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px;letter-spacing:-.04em}.muted{color:var(--muted);line-height:1.55}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:850;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}.danger{background:#fff1f0;color:var(--danger)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.metric{padding:16px}.metric .n{font-size:30px;font-weight:900;margin-top:7px}.card{padding:18px;margin-top:12px}.card h2,.card h3{margin-top:0}.progress{height:10px;background:#eef2f6;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:850;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.field textarea{min-height:95px;resize:vertical}.full{grid-column:1/-1}.platforms{display:flex;gap:8px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:7px;border:1px solid var(--line);padding:9px 11px;border-radius:12px;background:#fff}.notice{border:1px solid #fedf89;background:#fffaeb;color:#93370d;padding:12px 14px;border-radius:12px;line-height:1.5}.good{border-color:#abefc6;background:#ecfdf3;color:#05603a}.calendar{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.post{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;cursor:pointer}.post:hover{border-color:#b2ccff}.posttop{display:flex;justify-content:space-between;gap:8px;align-items:center}.date{font-size:12px;font-weight:900;color:var(--blue)}.pill{font-size:11px;padding:5px 7px;border-radius:999px;background:#f2f4f7;color:#344054;font-weight:800}.post h3{margin:10px 0 7px;font-size:17px}.post p{margin:0;color:var(--muted);line-height:1.45}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer;font-weight:800}.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.ideas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.idea{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.idea b{display:block;margin-bottom:6px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{font-size:12px;color:var(--muted)}.modal{display:none;position:fixed;inset:0;z-index:100;background:#10182899;align-items:flex-end;justify-content:center;padding:16px}.modal.on{display:flex}.sheet{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:18px}.bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fffffff5;border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));grid-template-columns:repeat(5,1fr)}.bottomnav button{padding:7px 3px;font-size:11px;border-radius:10px}.bottomnav button span{display:block;font-size:20px;margin-bottom:2px}.bottomnav button.on{color:var(--blue);background:#eef4ff}.empty{text-align:center;padding:38px 16px}.empty .ico{font-size:42px}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);z-index:150;background:#101828;color:#fff;padding:10px 14px;border-radius:12px;display:none}.toast.on{display:block}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:none}.main{padding:18px 14px 100px}.bottomnav{display:grid}.grid4{grid-template-columns:1fr 1fr}.calendar{grid-template-columns:1fr}.ideas{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.hero{display:block}.hero .actions{margin-top:12px}}@media(max-width:520px){.grid4{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.ideas{grid-template-columns:1fr}.top{height:58px}.layout{min-height:calc(100vh - 58px)}.hero h1{font-size:32px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><span>📱</span><b>SosyalPaket</b><span class="badge">Çalışan uygulama</span></div><div class="actions"><button class="btn secondary" onclick="location.href='../../'">Çözüm Merkezi</button><button id="installBtn" class="btn primary" onclick="installApp()">Kur</button></div></header>
<div class="layout">
<aside class="side" id="sideNav"></aside>
<main class="main">
<section id="dashboard" class="view on"></section>
<section id="setup" class="view"></section>
<section id="calendarView" class="view"></section>
<section id="library" class="view"></section>
<section id="analytics" class="view"></section>
<section id="settings" class="view"></section>
</main>
</div>
<nav class="bottomnav" id="bottomNav"></nav>
</div>
<div id="editModal" class="modal"><div class="sheet"><div class="posttop"><h2>İçeriği düzenle</h2><button class="btn secondary" onclick="closeEdit()">Kapat</button></div><div id="editBody"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const KEY='sosyalpaket-v2';
const NAV=[['dashboard','⌂','Özet'],['setup','＋','Plan'],['calendarView','▦','Takvim'],['library','✦','İçerik'],['analytics','◔','Analiz'],['settings','⚙','Ayarlar']];
let installPrompt=null,filter='Tümü';
let state=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch{return fresh()}}
function fresh(){return{profile:{brand:'',sector:'',audience:'',goal:'Etkileşim',tone:'Samimi',offer:'',platforms:['Instagram','Facebook']},posts:[],metrics:{impressions:0,interactions:0,clicks:0,followers:0},updated:null}}
function save(){state.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1700)}
function nav(){const html=NAV.map(([id,ic,t])=>`<button data-view="${id}" onclick="show('${id}')"><span>${ic}</span>${t}</button>`).join('');sideNav.innerHTML=html;bottomNav.innerHTML=html;syncNav()}
function syncNav(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',document.querySelector('#'+b.dataset.view)?.classList.contains('on')))}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));document.querySelector('#'+id).classList.add('on');syncNav();render(id);scrollTo(0,0)}
function render(id){({dashboard:renderDashboard,setup:renderSetup,calendarView:renderCalendar,library:renderLibrary,analytics:renderAnalytics,settings:renderSettings}[id]||(()=>{}))()}
function renderAll(){renderDashboard();renderSetup();renderCalendar();renderLibrary();renderAnalytics();renderSettings()}
function readyCount(){return state.posts.filter(p=>p.status==='Hazır').length}
function plannedCount(){return state.posts.filter(p=>p.status==='Planlandı').length}
function renderDashboard(){const n=state.posts.length,ready=readyCount(),planned=plannedCount(),pct=n?Math.round((ready+planned)/n*100):0;dashboard.innerHTML=`<div class="hero"><div><div class="muted">30 günlük sosyal medya çalışma alanı</div><h1>${state.profile.brand?esc(state.profile.brand):'SosyalPaket'}</h1><p class="muted">Fikir üret, 30 günlük plan oluştur, içerikleri düzenle, durumlarını takip et ve dışa aktar.</p></div><div class="actions"><button class="btn primary" onclick="show('setup')">${n?'Planı yenile':'Plan oluştur'}</button><button class="btn secondary" onclick="exportCSV()">CSV indir</button></div></div><div class="grid4"><div class="metric"><div class="muted">Toplam içerik</div><div class="n">${n}</div></div><div class="metric"><div class="muted">Hazır</div><div class="n">${ready}</div></div><div class="metric"><div class="muted">Planlandı</div><div class="n">${planned}</div></div><div class="metric"><div class="muted">Tamamlama</div><div class="n">${pct}%</div></div></div><div class="card"><h3>Plan ilerlemesi</h3><div class="progress"><i style="width:${pct}%"></i></div><p class="muted" style="margin-bottom:0">${n?`${ready+planned} / ${n} içerik hazır veya planlandı.`:'Önce marka bilgilerini girip 30 günlük planı üret.'}</p></div><div class="split"><div class="card"><h3>Sıradaki içerikler</h3>${n?state.posts.slice(0,4).map(p=>miniPost(p)).join(''):`<div class="empty"><div class="ico">🗓️</div><h3>Henüz plan yok</h3><p class="muted">Plan oluşturduğunda ilk içerikler burada görünecek.</p><button class="btn primary" onclick="show('setup')">Başla</button></div>`}</div><div class="card"><h3>Çalışma durumu</h3><div class="kv"><span>Marka</span><b>${esc(state.profile.brand||'—')}</b></div><div class="kv"><span>Hedef</span><b>${esc(state.profile.goal||'—')}</b></div><div class="kv"><span>Kanallar</span><b>${esc(state.profile.platforms.join(', ')||'—')}</b></div><div class="kv"><span>Son kayıt</span><b>${state.updated?new Date(state.updated).toLocaleString('tr-TR'):'—'}</b></div></div></div>`}
function miniPost(p){return `<div class="kv"><span><b>${esc(p.dateLabel)}</b><br><span class="muted">${esc(p.platform)} · ${esc(p.type)}</span></span><button class="btn secondary" onclick="editPost('${p.id}')">Aç</button></div>`}
function renderSetup(){const p=state.profile;setup.innerHTML=`<div class="hero"><div><div class="muted">Plan sihirbazı</div><h1>30 günlük plan oluştur</h1><p class="muted">Marka ve hedefe göre 30 ayrı içerik fikri, taslak metin, CTA, format ve yayın saati hazırlanır.</p></div></div><div class="card"><div class="formgrid"><div class="field"><label>İşletme / marka</label><input id="brand" value="${esc(p.brand)}" placeholder="Örn. Maraş Kahve"></div><div class="field"><label>Sektör</label><input id="sector" value="${esc(p.sector)}" placeholder="Örn. Kafe, tekstil, emlak"></div><div class="field"><label>Hedef müşteri</label><input id="audience" value="${esc(p.audience)}" placeholder="Örn. 20-40 yaş şehir içi müşteriler"></div><div class="field"><label>Ana hedef</label><select id="goal">${['Etkileşim','Satış','Marka bilinirliği','Mağaza ziyareti','Takipçi büyümesi'].map(x=>`<option ${x===p.goal?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>İletişim tonu</label><select id="tone">${['Samimi','Profesyonel','Enerjik','Sade','Premium'].map(x=>`<option ${x===p.tone?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Kampanya / teklif</label><input id="offer" value="${esc(p.offer)}" placeholder="Varsa indirim, ürün, hizmet"></div><div class="field full"><label>Platformlar</label><div class="platforms">${['Instagram','Facebook','TikTok','LinkedIn','X'].map(x=>`<label class="check"><input type="checkbox" name="platform" value="${x}" ${p.platforms.includes(x)?'checked':''}> ${x}</label>`).join('')}</div></div><div class="full"><button class="btn primary" onclick="generatePlan()">30 günlük planı üret</button></div></div></div><div class="notice">Bu sürüm sosyal ağ hesaplarına bağlanmaz ve otomatik paylaşım yapmaz. Plan, içerik, düzenleme, durum takibi ve dışa aktarma gerçekten çalışır; canlı yayın entegrasyonu ayrı aşamadır.</div>`}
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function generatePlan(){const platforms=[...document.querySelectorAll('input[name=platform]:checked')].map(x=>x.value);const profile={brand:brand.value.trim(),sector:sector.value.trim(),audience:audience.value.trim(),goal:goal.value,tone:tone.value,offer:offer.value.trim(),platforms};if(!profile.brand||!profile.sector||!profile.audience||!platforms.length){toast('Marka, sektör, hedef müşteri ve platform gerekli');return}state.profile=profile;const themes=['Marka hikâyesi','Müşteri problemi','Hızlı ipucu','Ürün faydası','Sık sorulan soru','Sosyal kanıt','Kulis / süreç','Karşılaştırma','Mini rehber','Hata / doğru','Müşteri yorumu','Ekip tanıtımı','Ürün detayı','Mit / gerçek','Anket','Öncesi / sonrası','Liste içerik','Soru-cevap','Kampanya','Günlük kullanım','Trend yorumu','Topluluk sorusu','Değer önerisi','Nasıl yapılır','İtiraz cevabı','Vaka örneği','Hatırlatma','Seçim rehberi','Haftanın özeti','Ay sonu CTA'];const types=['Reel','Carousel','Story','Görsel post','Kısa video'];const times=['10:00','12:30','15:00','18:30','20:30'];const seed=hash(profile.brand+profile.sector+profile.audience+profile.goal);const base=new Date();base.setHours(0,0,0,0);state.posts=themes.map((theme,i)=>{const d=new Date(base);d.setDate(d.getDate()+i);const platform=platforms[(seed+i)%platforms.length],type=types[(seed+i*3)%types.length],time=times[(seed+i*7)%times.length];const hook=hookFor(theme,profile);const caption=captionFor(theme,profile,hook);return{id:'p'+(i+1),day:i+1,date:d.toISOString().slice(0,10),dateLabel:d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'}),time,platform,type,theme,hook,caption,cta:ctaFor(profile),hashtags:tags(profile),status:'Taslak'}});save();renderAll();show('calendarView');toast('30 günlük plan hazır')}
function hookFor(theme,p){const b=p.brand;const map={'Marka hikâyesi':`${b} neden var? Kısaca hikâyemiz.`,'Müşteri problemi':`${p.audience} için en sık gördüğümüz sorun şu:`,'Hızlı ipucu':`${p.sector} alanında bugün uygulayabileceğin 1 hızlı ipucu.`,'Ürün faydası':`Bir ürün/hizmet seçerken yalnız fiyata bakma.`,'Sık sorulan soru':`Bize en sık sorulan sorulardan biri:`,'Sosyal kanıt':`Müşterilerin en çok değer verdiği nokta ne?`,'Kampanya':p.offer?`${p.offer} — kimler için mantıklı?`:`Bu hafta öne çıkarmak istediğimiz teklif:`};return map[theme]||`${theme}: ${p.audience} için kısa ve net bir içerik.`}
function captionFor(theme,p,hook){const tone={Samimi:'Kısaca anlatalım 👇',Profesyonel:'Net çerçeve şu:',Enerjik:'Hadi hızlıca bakalım 🚀',Sade:'Özet:',Premium:'Detaylarda fark yaratan nokta:'}[p.tone]||'Özet:';return `${hook}\n\n${tone} ${p.brand}, ${p.sector} alanında ${p.audience} için güvenilir ve anlaşılır bir deneyim sunmayı hedefliyor. ${p.offer?`Bu içerikte ${p.offer} teklifini doğal biçimde öne çıkar.`:''}`.trim()}
function ctaFor(p){return {'Satış':'Detay ve fiyat için mesaj gönder.','Etkileşim':'Senin deneyimin ne? Yorumda yaz.','Marka bilinirliği':'Kaydet ve ihtiyacı olan biriyle paylaş.','Mağaza ziyareti':'Uygunsan bugün uğra ve yerinde incele.','Takipçi büyümesi':'Benzer içerikler için hesabı takip et.'}[p.goal]||'Detay için mesaj gönder.'}
function tags(p){return ['#'+slug(p.brand),'#'+slug(p.sector),'#sosyalmedya','#işletme'].join(' ')}function slug(s){return String(s).toLocaleLowerCase('tr-TR').replace(/[^a-z0-9çğıöşü]+/g,'').slice(0,24)}
function renderCalendar(){if(!state.posts.length){calendarView.innerHTML=`<div class="empty"><div class="ico">🗓️</div><h2>Takvim boş</h2><p class="muted">Önce 30 günlük planı oluştur.</p><button class="btn primary" onclick="show('setup')">Plan oluştur</button></div>`;return}const plats=['Tümü',...new Set(state.posts.map(p=>p.platform))];const posts=filter==='Tümü'?state.posts:state.posts.filter(p=>p.platform===filter);calendarView.innerHTML=`<div class="hero"><div><div class="muted">İçerik takvimi</div><h1>30 günlük yayın planı</h1><p class="muted">Bir karta dokunup metni, saati, platformu ve durumunu değiştir.</p></div><div class="actions"><button class="btn secondary" onclick="exportCSV()">CSV indir</button><button class="btn secondary" onclick="printPlan()">PDF / Yazdır</button></div></div><div class="filters">${plats.map(x=>`<button class="${x===filter?'on':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div><div class="calendar">${posts.map(postCard).join('')}</div>`}
function setFilter(x){filter=x;renderCalendar()}
function postCard(p){return `<article class="post" onclick="editPost('${p.id}')"><div class="posttop"><span class="date">Gün ${p.day} · ${p.dateLabel} ${p.time}</span><span class="pill">${esc(p.status)}</span></div><h3>${esc(p.theme)}</h3><p>${esc(p.hook)}</p><div class="posttop" style="margin-top:10px"><span class="pill">${esc(p.platform)}</span><span class="pill">${esc(p.type)}</span></div></article>`}
function editPost(id){const p=state.posts.find(x=>x.id===id);if(!p)return;editBody.innerHTML=`<div class="formgrid"><div class="field"><label>Platform</label><select id="ep">${['Instagram','Facebook','TikTok','LinkedIn','X'].map(x=>`<option ${x===p.platform?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Format</label><select id="et">${['Reel','Carousel','Story','Görsel post','Kısa video'].map(x=>`<option ${x===p.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Tarih</label><input id="ed" type="date" value="${p.date}"></div><div class="field"><label>Saat</label><input id="etime" type="time" value="${p.time}"></div><div class="field full"><label>Başlık / hook</label><textarea id="eh">${esc(p.hook)}</textarea></div><div class="field full"><label>Metin</label><textarea id="ec" style="min-height:150px">${esc(p.caption)}</textarea></div><div class="field full"><label>CTA</label><input id="ecta" value="${esc(p.cta)}"></div><div class="field full"><label>Hashtag</label><input id="ehas" value="${esc(p.hashtags)}"></div><div class="field"><label>Durum</label><select id="es">${['Taslak','Hazır','Planlandı','Yayınlandı'].map(x=>`<option ${x===p.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="full actions"><button class="btn primary" onclick="savePost('${p.id}')">Kaydet</button><button class="btn secondary" onclick="copyPost('${p.id}')">Metni kopyala</button></div></div>`;editModal.classList.add('on')}
function closeEdit(){editModal.classList.remove('on')}
function savePost(id){const p=state.posts.find(x=>x.id===id);Object.assign(p,{platform:ep.value,type:et.value,date:ed.value,time:etime.value,hook:eh.value.trim(),caption:ec.value.trim(),cta:ecta.value.trim(),hashtags:ehas.value.trim(),status:es.value});p.dateLabel=new Date(p.date+'T00:00:00').toLocaleDateString('tr-TR',{day:'2-digit',month:'short'});save();closeEdit();renderAll();toast('İçerik kaydedildi')}
async function copyPost(id){const p=state.posts.find(x=>x.id===id);const t=`${p.caption}\n\n${p.cta}\n${p.hashtags}`;try{await navigator.clipboard.writeText(t);toast('Kopyalandı')}catch{toast('Kopyalama engellendi')}}
function renderLibrary(){if(!state.posts.length){library.innerHTML=`<div class="empty"><div class="ico">✦</div><h2>İçerik kütüphanesi boş</h2><p class="muted">Plan üretilince 30 farklı içerik fikri burada sınıflanır.</p><button class="btn primary" onclick="show('setup')">Plan oluştur</button></div>`;return}library.innerHTML=`<div class="hero"><div><div class="muted">İçerik kütüphanesi</div><h1>30 içerik açısı</h1><p class="muted">Başlık, format ve CTA fikirlerini hızlıca gözden geçir.</p></div></div><div class="ideas">${state.posts.map(p=>`<div class="idea"><span class="pill">${esc(p.type)}</span><b>${esc(p.theme)}</b><div class="muted">${esc(p.hook)}</div><button class="btn secondary" style="margin-top:10px" onclick="editPost('${p.id}')">Düzenle</button></div>`).join('')}</div>`}
function renderAnalytics(){const m=state.metrics,er=m.impressions?((m.interactions/m.impressions)*100).toFixed(2):'0.00',ctr=m.impressions?((m.clicks/m.impressions)*100).toFixed(2):'0.00';analytics.innerHTML=`<div class="hero"><div><div class="muted">Manuel performans takibi</div><h1>Analiz</h1><p class="muted">Sosyal ağ entegrasyonu bağlı olmadığı için gerçek metrikleri elle gir; oranlar otomatik hesaplanır.</p></div></div><div class="grid4"><div class="metric"><div class="muted">Gösterim</div><div class="n">${Number(m.impressions).toLocaleString('tr-TR')}</div></div><div class="metric"><div class="muted">Etkileşim</div><div class="n">${Number(m.interactions).toLocaleString('tr-TR')}</div></div><div class="metric"><div class="muted">Etkileşim oranı</div><div class="n">${er}%</div></div><div class="metric"><div class="muted">CTR</div><div class="n">${ctr}%</div></div></div><div class="card"><h3>Metrik gir</h3><div class="formgrid"><div class="field"><label>Gösterim</label><input id="mi" type="number" min="0" value="${m.impressions}"></div><div class="field"><label>Etkileşim</label><input id="me" type="number" min="0" value="${m.interactions}"></div><div class="field"><label>Link tıklaması</label><input id="mc" type="number" min="0" value="${m.clicks}"></div><div class="field"><label>Takipçi</label><input id="mf" type="number" min="0" value="${m.followers}"></div><div class="full"><button class="btn primary" onclick="saveMetrics()">Metrikleri kaydet</button></div></div></div>`}
function saveMetrics(){state.metrics={impressions:+mi.value||0,interactions:+me.value||0,clicks:+mc.value||0,followers:+mf.value||0};save();renderAnalytics();toast('Metrikler kaydedildi')}
function renderSettings(){settings.innerHTML=`<div class="hero"><div><div class="muted">Uygulama ayarları</div><h1>Ayarlar</h1></div></div><div class="card"><h3>Kurulum</h3><p class="muted">SosyalPaket kendi PWA manifestine sahiptir. Desteklenen tarayıcıda ayrı uygulama olarak kurulabilir.</p><button class="btn primary" onclick="installApp()">SosyalPaket'i kur</button></div><div class="card"><h3>Veri</h3><p class="muted">Plan ve düzenlemeler bu cihazın tarayıcı depolamasında tutulur. Sunucu hesabı veya ödeme bağlı değildir.</p><div class="actions"><button class="btn secondary" onclick="exportJSON()">Yedek indir</button><button class="btn danger" onclick="resetAll()">Tüm veriyi sil</button></div></div><div class="card"><h3>Çalışan / çalışmayan sınır</h3><div class="kv"><span>30 günlük plan</span><b>Çalışıyor</b></div><div class="kv"><span>İçerik düzenleme ve kayıt</span><b>Çalışıyor</b></div><div class="kv"><span>CSV / yazdırma</span><b>Çalışıyor</b></div><div class="kv"><span>Sosyal ağ hesabı bağlama</span><b>Henüz yok</b></div><div class="kv"><span>Otomatik yayınlama</span><b>Henüz yok</b></div></div>`}
function exportCSV(){if(!state.posts.length){toast('Önce plan oluştur');return}const rows=[['Gün','Tarih','Saat','Platform','Format','Tema','Hook','Metin','CTA','Hashtag','Durum'],...state.posts.map(p=>[p.day,p.date,p.time,p.platform,p.type,p.theme,p.hook,p.caption,p.cta,p.hashtags,p.status])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');download(csv,'SosyalPaket-30-gun-plan.csv','text/csv;charset=utf-8')}
function exportJSON(){download(JSON.stringify(state,null,2),'SosyalPaket-yedek.json','application/json;charset=utf-8')}
function download(content,name,type){const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Dosya indirildi')}
function printPlan(){if(!state.posts.length){toast('Önce plan oluştur');return}const w=open('','_blank');if(!w){toast('Açılır pencereye izin ver');return}w.document.write(`<!doctype html><meta charset="utf-8"><title>SosyalPaket</title><style>body{font-family:Arial;max-width:900px;margin:auto;padding:30px}article{border-bottom:1px solid #ddd;padding:12px 0}small{color:#666}</style><h1>${esc(state.profile.brand)} — 30 günlük plan</h1>${state.posts.map(p=>`<article><small>Gün ${p.day} · ${p.date} ${p.time} · ${esc(p.platform)} · ${esc(p.type)}</small><h3>${esc(p.theme)}</h3><p>${esc(p.caption).replace(/\n/g,'<br>')}</p><b>${esc(p.cta)}</b><p>${esc(p.hashtags)}</p></article>`).join('')}`);w.document.close();setTimeout(()=>w.print(),300)}
function resetAll(){if(!confirm('SosyalPaket verileri silinsin mi?'))return;state=fresh();save();renderAll();show('dashboard');toast('Veriler silindi')}
function installApp(){const standalone=matchMedia('(display-mode:standalone)').matches||navigator.standalone===true;if(standalone){toast('SosyalPaket zaten uygulama modunda açık');return}if(installPrompt){const e=installPrompt;installPrompt=null;e.prompt();return}const ua=navigator.userAgent.toLowerCase();if(/iphone|ipad|ipod/.test(ua))alert('Safari → Paylaş → Ana Ekrana Ekle');else if(/android/.test(ua))alert('Tarayıcı menüsü → Uygulamayı yükle / Ana ekrana ekle');else alert('Chrome/Edge menüsünden Uygulamayı yükle seçeneğini kullan.')}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});addEventListener('appinstalled',()=>{installPrompt=null;toast('SosyalPaket kuruldu')});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
nav();renderAll();
</script>
</body></html>
