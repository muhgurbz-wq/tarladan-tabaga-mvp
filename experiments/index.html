<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b57d0"><link rel="manifest" href="manifest.webmanifest"><title>Dijital Çözüm Merkezi</title><style>:root{--b:#f4f7fb;--w:#fff;--t:#0f172a;--m:#64748b;--l:#e2e8f0;--p:#0b57d0;--p2:#073b91;--g:#087443}*{box-sizing:border-box}body{margin:0;background:var(--b);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--t)}button,input,textarea{font:inherit}.app{max-width:1180px;margin:auto;min-height:100vh;background:var(--w)}header{position:sticky;top:0;z-index:20;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--l);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850}.secure{font-size:12px;color:var(--g);background:#ecfdf3;border:1px solid #a7f3d0;padding:7px 10px;border-radius:999px}.hero{padding:34px 20px 20px;background:linear-gradient(180deg,#f6f9ff,#fff)}.hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 10px;letter-spacing:-.04em}.hero p{max-width:760px;color:var(--m);line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{background:var(--p);color:#fff}.primary:hover{background:var(--p2)}.ghost{background:#fff;border:1px solid var(--l);color:var(--t)}.section{padding:8px 20px 40px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{border:1px solid var(--l);border-radius:18px;padding:18px;background:#fff;box-shadow:0 2px 8px #0f172a0b;cursor:pointer}.card:hover{box-shadow:0 14px 30px #0f172a14;transform:translateY(-1px)}.icon{width:44px;height:44px;border-radius:12px;background:#eef4ff;display:grid;place-items:center;font-size:20px}.cat{font-size:12px;color:var(--p);font-weight:800;margin:12px 0 6px}.card h3{margin:0 0 7px}.card p{margin:0;color:var(--m);line-height:1.5;font-size:14px}.more{margin-top:14px;color:var(--p);font-weight:800;font-size:14px}.detail{display:none;min-height:100vh}.detail.show{display:block}.catalog.hide{display:none}.dtop{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--l);padding:13px 16px;display:flex;gap:10px;align-items:center;z-index:30}.back{border:1px solid var(--l);background:#fff;border-radius:10px;padding:9px 11px}.wrap{max-width:900px;margin:auto;padding:28px 18px 70px}.panel{border:1px solid var(--l);border-radius:22px;padding:24px;background:linear-gradient(135deg,#f7faff,#fff)}.panel h1{margin:8px 0 8px;font-size:34px}.panel p,.box p,.box li{color:var(--m);line-height:1.65}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{border:1px solid #c7d8ff;background:#fff;border-radius:999px;padding:7px 9px;font-size:12px}.boxes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.box{border:1px solid var(--l);border-radius:18px;padding:18px}.box h3{margin:0 0 8px}.box ul{padding-left:18px;margin-bottom:0}.wide{grid-column:1/-1}.order{margin-top:14px;border:1px solid #b8cdfc;background:#f6f9ff;border-radius:18px;padding:20px}.order h3{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form textarea{width:100%;border:1px solid var(--l);border-radius:12px;padding:12px;background:#fff}.form textarea{min-height:92px;resize:vertical}.full{grid-column:1/-1}.note{font-size:12px;color:var(--m);margin-top:10px}.installHelp{display:none;margin-top:12px;padding:12px;border-radius:12px;background:#fff8e8;color:#7c4a03}.thanks{display:none;margin-top:10px;color:var(--g);font-weight:800}@media(max-width:700px){header,.hero,.section{padding-left:15px;padding-right:15px}.grid,.boxes,.form{grid-template-columns:1fr}.wide,.full{grid-column:auto}.panel h1{font-size:29px}}</style></head><body><div class="app"><div id="catalog" class="catalog"><header><div class="brand">Dijital Çözüm Merkezi</div><div class="secure">Güvenli ön talep</div></header><section class="hero"><h1>İşiniz için hazır, sade ve güçlü dijital araçlar.</h1><p>Her çözümü inceleyin, cihazınıza uygulama gibi kurun ve ihtiyacınız olan ürünü seçin; bu test aşamasında ödeme alınmaz, talebiniz doğrudan bize bildirilir.</p><div class="actions"><button id="installBtn" class="btn primary">Uygulamayı cihaza kur</button><button class="btn ghost" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">Çözümleri incele</button></div><div id="installHelp" class="installHelp"></div></section><section class="section"><div class="grid" id="grid"></div></section></div><div id="detail" class="detail"><div class="dtop"><button class="back" onclick="closeDetail()">← Geri</button><strong id="dtop">Ürün detayı</strong></div><main id="content" class="wrap"></main></div></div><script>const P=[['TeklifPilot','KOBİ','📄','Profesyonel teklif hazırlama','Teklif hazırlama süresini kısaltır; kapsam, teslim ve şartları tek düzende toplar.'],['SosyalPaket','Pazarlama','📱','30 günlük sosyal medya planı','İşletme için konu, gönderi, kampanya ve yayın takvimi oluşturur.'],['MenüPilot','Restoran','🍽️','Menü ve kampanya paketi','Ürün açıklamalarını, kampanya dilini ve menü sunumunu iyileştirir.'],['Emlakİlan','Emlak','🏠','Profesyonel emlak ilan paketi','Mülkün güçlü yönlerini anlaşılır ve güven veren ilan metnine dönüştürür.'],['CVPilot','Kariyer','🧾','CV ve başvuru paketi','CV özeti, deneyim sunumu ve başvuru metnini düzenler.'],['EsnafAsistan','Esnaf','💬','Müşteri mesaj asistanı','Fiyat, randevu, şikâyet ve satış mesajlarını hızlıca hazırlar.'],['Ürünİlan','E-ticaret','🛍️','Ürün satış metni paketi','Başlık, açıklama, fayda ve sık sorulan soruları hazırlar.'],['GoogleYorum','İşletme','⭐','Yorum cevap asistanı','Olumlu ve olumsuz müşteri yorumlarına profesyonel cevap üretir.'],['FiyatTeklif','Hizmet','💼','Fiyat ve paket sunumu','Hizmeti paketler, kapsamı netleştirir ve müşteriye sunulabilir hale getirir.'],['İçerikTakvim','Pazarlama','🗓️','Aylık içerik planı','Aylık yayın planı, konu başlıkları ve kampanya günleri oluşturur.'],['KatalogPilot','Üretici','📚','Ürün kataloğu paketi','Ürün özelliklerini satış diliyle düzenlenmiş katalog metnine çevirir.'],['MüşteriTakip','Satış','👥','Müşteri takip sistemi','Müşteri, görüşme, sonraki adım ve hatırlatmaları tek yerde toplar.'],['RandevuMetin','Hizmet','⏰','Randevu mesaj paketi','Onay, hatırlatma, gecikme ve iptal mesajlarını standartlaştırır.'],['İhracatİlan','İhracat','🌍','İngilizce satış sunumu','Türkçe ürün bilgisini dış pazara uygun İngilizce satış sunumuna dönüştürür.'],['FirmaProfil','B2B','🏢','Kurumsal firma profili','Firma tanıtımı, yetkinlikler, hizmetler ve değer önerisini profesyonelce sunar.'],['PazarAnaliz','Girişim','📊','Rakip ve konumlandırma özeti','Rakipleri, hedef müşteriyi ve farklılaşma alanlarını düzenli rapora çevirir.'],['KampanyaPilot','Perakende','🎯','Kampanya ve reklam paketi','Kampanya fikri, başlık, teklif ve çağrı metinleri üretir.'],['MüşteriSSS','Destek','❓','Hazır soru-cevap merkezi','Sık sorulan soruları ve net müşteri cevaplarını tek merkezde toplar.'],['SatışScript','Satış','☎️','Satış görüşmesi senaryosu','Telefon ve mesaj görüşmeleri için adım adım satış akışı hazırlar.'],['WebMetin','Web','🖥️','Tek sayfalık satış sitesi metni','Başlık, fayda, güven, hizmet ve çağrı bölümlerini hazırlar.']];const grid=document.getElementById('grid');P.forEach((p,i)=>{const e=document.createElement('article');e.className='card';e.onclick=()=>openDetail(i);e.innerHTML=`<div class=icon>${p[2]}</div><div class=cat>${p[1]}</div><h3>${p[0]}</h3><p>${p[3]}. ${p[4]}</p><div class=more>Detayları aç →</div>`;grid.appendChild(e)});function openDetail(i){const p=P[i];catalog.classList.add('hide');detail.classList.add('show');dtop.textContent=p[0];content.innerHTML=`<section class=panel><div class=cat>${p[1]}</div><h1>${p[0]}</h1><p>${p[4]}</p><div class=chips><span class=chip>Mobil uyumlu</span><span class=chip>Hızlı kullanım</span><span class=chip>Ödeme yok</span><span class=chip>Kurulabilir web uygulaması</span></div></section><section class=boxes><div class=box><h3>Ne çözer?</h3><p>${p[3]} sürecindeki dağınıklığı ve zaman kaybını azaltmak için tasarlanmıştır.</p></div><div class=box><h3>Kimler için?</h3><p>${p[1]} alanında çalışan küçük işletmeler, bağımsız profesyoneller ve ekipler.</p></div><div class=box><h3>Size ne verir?</h3><ul><li>Hazır, düzenli çıktı</li><li>Net iş akışı</li><li>Mobil kullanım</li><li>Tekrar kullanılabilir şablon</li></ul></div><div class=box><h3>Nasıl çalışır?</h3><ul><li>İhtiyacınızı seçersiniz</li><li>Gerekli bilgileri girersiniz</li><li>Sistem çıktıyı hazırlar</li><li>Kontrol edip kullanırsınız</li></ul></div><div class='box wide'><h3>Kurulum ve erişim</h3><p>Bu merkez telefonunuza veya bilgisayarınıza uygulama gibi kurulabilir; ana ekrandan tek dokunuşla açılır. Ürün talebi verdiğinizde seçtiğiniz çözüm ve iletişim bilgileriniz bize bildirilir.</p><button class='btn ghost' onclick='installApp()'>Cihaza kur</button></div></section><section class=order><h3>Bu çözümü istiyorum</h3><p style='color:var(--m)'>Talebinizi bırakın; seçtiğiniz ürün bize bildirim olarak ulaşsın. Test aşamasında ödeme alınmaz.</p><form action='https://formsubmit.co/muh.gurbz@gmail.com' method='POST' onsubmit='prepareForm(this,"${p[0]}")'><input type=hidden name='_subject' value='Yeni dijital ürün talebi'><input type=hidden name='_captcha' value='false'><input type=hidden name='Ürün' value='${p[0]}'><input type=hidden name='_next' value='https://muhgurbz-wq.github.io/tarladan-tabaga-mvp/experiments/?talep=alindi'><div class=form><input required name='Ad Soyad' placeholder='Ad Soyad'><input required name='E-posta' type=email placeholder='E-posta'><input name='Telefon' placeholder='Telefon / WhatsApp'><input name='Firma' placeholder='Firma / İşletme'><textarea class=full name='İhtiyaç' placeholder='Kısaca neye ihtiyacınız olduğunu yazın'></textarea><button class='btn primary full' type=submit>Talebi gönder</button></div></form><div class=note>Gönderim sonrası talep seçilen ürün adıyla birlikte e-posta bildirimi olarak iletilir.</div></section>`;scrollTo(0,0)}function closeDetail(){detail.classList.remove('show');catalog.classList.remove('hide');scrollTo(0,0)}function prepareForm(f,n){localStorage.setItem('lastLead',JSON.stringify({product:n,time:new Date().toISOString()}))}let deferred;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});async function installApp(){if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}else{installHelp.style.display='block';installHelp.textContent=/iphone|ipad|ipod/i.test(navigator.userAgent)?'iPhone/iPad: Paylaş menüsünü açın ve “Ana Ekrana Ekle” seçeneğini kullanın.':'Tarayıcı menüsünden “Uygulamayı yükle” veya “Ana ekrana ekle” seçeneğini kullanın.'}}installBtn.onclick=installApp;if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');if(new URLSearchParams(location.search).get('talep')==='alindi'){installHelp.style.display='block';installHelp.textContent='Talebiniz başarıyla gönderildi. Teşekkür ederiz.'}</script></body></html>
