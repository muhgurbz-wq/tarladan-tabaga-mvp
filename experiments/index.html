<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dijital Çözüm Merkezi</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--brand:#175cd3;--brand2:#0b4aa2;--ok:#067647;--soft:#eff4ff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.app{max-width:1180px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.badge{font-size:12px;color:var(--ok);background:#ecfdf3;border:1px solid #abefc6;padding:7px 10px;border-radius:999px}.hero{padding:34px 22px 20px;background:linear-gradient(180deg,#f8faff,#fff)}.hero h1{margin:0 0 10px;font-size:clamp(30px,6vw,48px);letter-spacing:-.03em}.hero p{margin:0;color:var(--muted);max-width:760px;font-size:17px;line-height:1.6}.search{margin-top:22px;max-width:620px;position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:#fff;outline:none}.search input:focus{border-color:#84adff;box-shadow:0 0 0 4px #eff4ff}.section{padding:14px 22px 36px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:12px 0 16px}.section-head h2{margin:0;font-size:22px}.section-head span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.04);cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,24,40,.08)}.icon{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px;margin-bottom:14px}.cat{font-size:12px;color:var(--brand);font-weight:700;margin-bottom:6px}.card h3{margin:0 0 8px;font-size:18px}.card p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}.open{margin-top:16px;color:var(--brand);font-weight:700;font-size:14px}.detail{display:none;min-height:100vh;background:#fff}.detail.show{display:block}.catalog.hide{display:none}.dtop{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;z-index:20}.back{border:0;background:#f2f4f7;border-radius:10px;padding:10px 12px;cursor:pointer}.dwrap{max-width:900px;margin:auto;padding:32px 22px 60px}.dhero{padding:26px;border-radius:22px;background:linear-gradient(135deg,#eff4ff,#f8faff);border:1px solid #d1e0ff}.dhero h1{margin:8px 0 10px;font-size:36px;letter-spacing:-.03em}.dhero p{color:var(--muted);font-size:17px;line-height:1.65;margin:0}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{background:#fff;border:1px solid #d1e0ff;border-radius:999px;padding:8px 10px;font-size:13px}.blocks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.block{border:1px solid var(--line);border-radius:18px;padding:20px}.block h3{margin:0 0 10px}.block p,.block li{color:var(--muted);line-height:1.6;font-size:15px}.block ul{padding-left:18px;margin-bottom:0}.wide{grid-column:1/-1}.cta{margin-top:18px;border:1px solid #b2ccff;background:#f5f8ff;border-radius:18px;padding:20px;display:flex;justify-content:space-between;gap:18px;align-items:center}.cta strong{display:block;margin-bottom:5px}.cta span{color:var(--muted);font-size:14px}.btn{border:0;background:var(--brand);color:#fff;border-radius:12px;padding:13px 17px;font-weight:800;cursor:pointer;white-space:nowrap}.btn:hover{background:var(--brand2)}.notice{margin-top:14px;color:var(--ok);font-size:14px;font-weight:700;display:none}@media(max-width:720px){.top{padding:14px 16px}.hero,.section{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}.blocks{grid-template-columns:1fr}.wide{grid-column:auto}.cta{align-items:flex-start;flex-direction:column}.dwrap{padding:22px 16px 44px}.dhero h1{font-size:30px}}</style></head><body><div class="app"><div class="catalog" id="catalog"><header class="top"><div class="brand">Dijital Çözüm Merkezi</div><div class="badge">Ücretsiz ön talep</div></header><section class="hero"><h1>İşinizi hızlandıran sade ve güçlü çözümler.</h1><p>Her çözüm gerçek bir iş problemini hedefler; kartı açtığınızda ne işe yaradığını, kime uygun olduğunu, hangi çıktıları verdiğini ve nasıl çalıştığını net biçimde görebilirsiniz.</p><div class="search"><input id="q" placeholder="Çözüm ara: teklif, emlak, içerik, müşteri..." oninput="render()"></div></section><section class="section"><div class="section-head"><h2>Çözümler</h2><span id="count"></span></div><div class="grid" id="grid"></div></section></div><div class="detail" id="detail"><div class="dtop"><button class="back" onclick="closeDetail()">← Geri</button><strong id="dtitleTop">Detay</strong></div><div class="dwrap" id="dcontent"></div></div></div><script>const products=[
{name:'TeklifPilot',cat:'KOBİ',icon:'📄',short:'Müşteriye hızlı ve profesyonel teklif hazırlama.',problem:'Teklif hazırlamak zaman alıyor ve standart olmadığı için satış süreci yavaşlıyor.',forwhom:'Hizmet işletmeleri, ustalar, danışmanlar, ajanslar ve küçük işletmeler.',outputs:['Profesyonel teklif metni','Hizmet kalemleri ve kapsam','Teslim süresi ve şartlar','Müşteriye gönderilebilir temiz çıktı'],flow:['İş türünü ve müşteri ihtiyacını gir','Hizmetleri ve kapsamı seç','Teklif taslağı otomatik oluşsun','Kontrol edip müşteriye gönder'],benefit:'Teklif hazırlama süresini dakikalara indirerek satış görüşmesini hızlandırmayı amaçlar.'},
{name:'SosyalPaket',cat:'Pazarlama',icon:'📱',short:'30 günlük işletme sosyal medya içerik planı.',problem:'Ne paylaşılacağı bilinmediği için sosyal medya düzensiz ve etkisiz kalıyor.',forwhom:'Esnaf, yerel işletmeler, hizmet firmaları ve küçük markalar.',outputs:['30 günlük içerik takvimi','Gönderi başlıkları','Kısa açıklama metinleri','Kampanya ve çağrı önerileri'],flow:['Sektörü seç','Hedef müşteriyi tanımla','İletişim tonunu belirle','30 günlük planı oluştur'],benefit:'İçerik üretimindeki kararsızlığı azaltıp düzenli görünürlük sağlamayı amaçlar.'},
{name:'MenüPilot',cat:'Restoran',icon:'🍽️',short:'Menü, ürün açıklaması ve kampanya metni üretimi.',problem:'Menüler çoğu zaman ürünün değerini iyi anlatmıyor ve kampanyalar zayıf kalıyor.',forwhom:'Restoran, kafe, pastane, paket servis işletmeleri.',outputs:['Menü ürün açıklamaları','Kampanya başlıkları','Paket servis metinleri','Öne çıkan ürün önerileri'],flow:['Menüyü gir','Hedef müşteri tipini seç','Ürünleri sınıflandır','Yeni sunum ve kampanya metinlerini al'],benefit:'Menü okunabilirliğini ve ürünlerin satış gücünü artırmayı hedefler.'},
{name:'Emlakİlan',cat:'Emlak',icon:'🏠',short:'Daha güçlü emlak ilanı ve sunum paketi.',problem:'İlanlar birbirine benziyor ve mülkün gerçek avantajları net anlatılmıyor.',forwhom:'Emlak danışmanları, mülk sahipleri ve küçük emlak ofisleri.',outputs:['Başlık seçenekleri','Profesyonel ilan açıklaması','Öne çıkan özellikler','Alıcıya uygun çağrı metni'],flow:['Mülk özelliklerini gir','Konum ve hedef alıcıyı belirt','Güçlü yönleri seç','Yayınlanabilir ilan metnini al'],benefit:'İlanı daha anlaşılır, güven veren ve dönüşüm odaklı hale getirmeyi amaçlar.'},
{name:'CVPilot',cat:'Kariyer',icon:'🧾',short:'CV ve iş başvurusu iyileştirme.',problem:'CV güçlü olsa bile deneyim ve beceriler doğru sunulmadığında aday geride kalıyor.',forwhom:'İş arayanlar, yeni mezunlar ve kariyer değiştirenler.',outputs:['CV metni düzenleme','Profil özeti','Başvuru mektubu','İlana göre beceri eşleştirmesi'],flow:['Mevcut bilgilerini gir','Hedef pozisyonu seç','Deneyimleri ekle','Düzenlenmiş başvuru paketini al'],benefit:'Adayın deneyimini daha net ve profesyonel göstermeyi hedefler.'},
{name:'EsnafAsistan',cat:'Esnaf',icon:'💬',short:'Müşteri mesajlarına hızlı ve profesyonel cevaplar.',problem:'Yoğunlukta geç veya düzensiz cevap vermek müşteri kaybına yol açabiliyor.',forwhom:'Esnaf, servis işletmeleri, küçük mağazalar ve bireysel hizmet verenler.',outputs:['Fiyat sorusuna cevap','Randevu cevabı','Şikâyet cevabı','Satışa yönlendiren mesajlar'],flow:['Müşteri mesajını gir','Amaç seç','Ton belirle','Hazır cevap oluştur'],benefit:'Müşteri iletişimini hızlandırıp daha tutarlı hale getirmeyi amaçlar.'},
{name:'Ürünİlan',cat:'E-ticaret',icon:'🛍️',short:'Ürün başlığı, açıklama ve satış metni paketi.',problem:'Zayıf ürün açıklamaları müşterinin güvenini ve satın alma isteğini azaltabiliyor.',forwhom:'Pazar yeri satıcıları, küçük e-ticaret mağazaları ve üreticiler.',outputs:['SEO uyumlu başlık','Ürün açıklaması','Öne çıkan faydalar','Sık sorulan sorular'],flow:['Ürünü tanımla','Hedef müşteriyi seç','Avantajları gir','Satış metnini oluştur'],benefit:'Ürünü daha anlaşılır ve ikna edici şekilde sunmayı amaçlar.'},
{name:'GoogleYorum',cat:'İşletme',icon:'⭐',short:'Müşteri yorumlarına profesyonel cevap taslakları.',problem:'Yorumlara cevap vermemek veya yanlış tonda cevap vermek marka algısını zedeleyebiliyor.',forwhom:'Google işletme profili kullanan tüm yerel işletmeler.',outputs:['Olumlu yorum cevabı','Olumsuz yorum cevabı','Şikâyet yönetimi metni','Kurumsal ton seçenekleri'],flow:['Yorumu yapıştır','Durumu seç','Ton belirle','Hazır cevabı al'],benefit:'İşletmenin yorumlara düzenli ve profesyonel cevap vermesini sağlar.'},
{name:'FiyatTeklif',cat:'Hizmet',icon:'💼',short:'Hizmet işletmeleri için fiyat ve teklif yapısı.',problem:'Fiyatı nasıl sunacağını bilememek müşteride belirsizlik oluşturuyor.',forwhom:'Tamir, bakım, danışmanlık, tasarım ve saha hizmetleri.',outputs:['Paket önerileri','Fiyat sunum metni','Kapsam sınırları','Ek hizmet seçenekleri'],flow:['Hizmeti gir','Maliyet ve kapsamı tanımla','Paketleri seç','Müşteriye sunulabilir yapı oluştur'],benefit:'Fiyatı daha net ve profesyonel sunmayı hedefler.'},
{name:'İçerikTakvim',cat:'Pazarlama',icon:'🗓️',short:'Küçük işletmeler için aylık içerik takvimi.',problem:'Plan olmayınca içerik üretimi aksıyor ve marka görünürlüğü düzensizleşiyor.',forwhom:'Küçük işletmeler ve kişisel markalar.',outputs:['Aylık yayın planı','Konu başlıkları','Kampanya günleri','İçerik türü önerileri'],flow:['Sektörü seç','Aylık hedefi gir','Platformları belirt','Takvimi oluştur'],benefit:'İçerik üretimini düzenli ve sürdürülebilir hale getirmeyi amaçlar.'},
{name:'KatalogPilot',cat:'Üretici',icon:'📚',short:'Ürün kataloğu metni ve sunum paketi.',problem:'Üreticiler ürünlerini teknik olarak biliyor fakat satış diliyle sunmakta zorlanabiliyor.',forwhom:'Üreticiler, toptancılar ve B2B satıcılar.',outputs:['Ürün açıklamaları','Kategori metinleri','Avantaj listeleri','Kurumsal katalog dili'],flow:['Ürün listesini gir','Hedef pazarı seç','Teknik bilgileri ekle','Katalog metinlerini oluştur'],benefit:'Ürün portföyünü daha profesyonel ve ticari biçimde sunmayı hedefler.'},
{name:'MüşteriTakip',cat:'Satış',icon:'👥',short:'Basit müşteri takip ve hatırlatma sistemi.',problem:'Teklif verilen veya geri dönüş beklenen müşteriler kolayca unutulabiliyor.',forwhom:'Satış yapan küçük işletmeler ve bireysel hizmet sağlayıcılar.',outputs:['Müşteri durum listesi','Geri dönüş tarihleri','Takip mesajları','Önceliklendirme'],flow:['Müşteriyi ekle','Durumu seç','Sonraki adımı belirle','Takip zamanını kaydet'],benefit:'Satış fırsatlarının unutulmasını azaltmayı amaçlar.'},
{name:'RandevuMetin',cat:'Hizmet',icon:'⏰',short:'Randevu onay ve hatırlatma mesajları.',problem:'Randevuların unutulması işletmede boş zaman ve gelir kaybına neden olabiliyor.',forwhom:'Kuaför, klinik dışı hizmetler, servis, bakım ve danışmanlık işletmeleri.',outputs:['Randevu onayı','Hatırlatma mesajı','Gecikme bildirimi','İptal/yeniden planlama metni'],flow:['Randevu bilgilerini gir','Mesaj türünü seç','Ton belirle','Hazır mesajı oluştur'],benefit:'Randevu iletişimini düzenleyip unutulan randevuları azaltmayı hedefler.'},
{name:'İhracatİlan',cat:'İhracat',icon:'🌍',short:'Türkçe ürünü İngilizce satış sunumuna çevirme.',problem:'Kelime kelime çeviri, ürünün ticari değerini yabancı müşteriye aktarmaya yetmeyebiliyor.',forwhom:'İhracata başlamak isteyen üretici ve KOBİ’ler.',outputs:['İngilizce ürün açıklaması','B2B satış mesajı','Kısa şirket tanıtımı','Teklif e-postası taslağı'],flow:['Türkçe ürün bilgisini gir','Hedef ülke/pazarı seç','Avantajları ekle','İngilizce satış paketini oluştur'],benefit:'Ürünü yabancı alıcıya daha anlaşılır ve ticari biçimde sunmayı hedefler.'},
{name:'FirmaProfil',cat:'B2B',icon:'🏢',short:'Kurumsal firma tanıtım metni paketi.',problem:'Şirketi net anlatamamak yeni müşteride güven eksikliği oluşturabiliyor.',forwhom:'KOBİ’ler, üreticiler ve hizmet firmaları.',outputs:['Firma tanıtımı','Hakkımızda metni','Yetkinlikler listesi','B2B tanışma mesajı'],flow:['Firma bilgilerini gir','Hedef müşteriyi seç','Güçlü yönleri ekle','Kurumsal metin paketini al'],benefit:'Firmayı daha güvenilir, net ve profesyonel sunmayı amaçlar.'},
{name:'PazarAnaliz',cat:'Girişim',icon:'📊',short:'Rakip ve konumlandırma raporu taslağı.',problem:'Pazara rakipleri ve müşteri ihtiyacını anlamadan çıkmak yanlış konumlandırmaya yol açabiliyor.',forwhom:'Yeni girişimler ve yeni ürün çıkaran işletmeler.',outputs:['Rakip çerçevesi','Müşteri segmentleri','Farklılaşma önerileri','Risk ve fırsat listesi'],flow:['Ürün/fikri tanımla','Hedef pazarı seç','Rakipleri ekle','Analiz taslağını oluştur'],benefit:'Pazara çıkmadan önce daha sistemli düşünmeyi sağlar.'},
{name:'KampanyaPilot',cat:'Perakende',icon:'📣',short:'Kampanya fikri ve satış metni paketi.',problem:'İndirim yapmak tek başına müşteriyi harekete geçirmeyebiliyor.',forwhom:'Perakende mağazaları, e-ticaret satıcıları ve yerel işletmeler.',outputs:['Kampanya fikri','Başlık alternatifleri','Duyuru metni','Çağrı cümleleri'],flow:['Ürünü seç','Kampanya amacını gir','Süreyi belirt','Hazır kampanya paketini al'],benefit:'Kampanyayı daha anlaşılır ve dikkat çekici hale getirmeyi amaçlar.'},
{name:'MüşteriSSS',cat:'Destek',icon:'❓',short:'İşletme için hazır soru-cevap merkezi.',problem:'Aynı sorulara tekrar tekrar cevap vermek zaman kaybettiriyor.',forwhom:'Müşteri sorusu alan her küçük işletme.',outputs:['Sık sorulan sorular','Net cevaplar','Politika açıklamaları','Web/WhatsApp kullanıma hazır metin'],flow:['İşletme türünü gir','Sık gelen soruları ekle','Kuralları belirt','SSS merkezini oluştur'],benefit:'Tekrarlanan müşteri sorularını azaltıp iletişimi standartlaştırmayı hedefler.'},
{name:'SatışScript',cat:'Satış',icon:'☎️',short:'Telefon ve mesaj satış görüşmesi senaryosu.',problem:'Satış görüşmesi plansız ilerlediğinde önemli sorular ve kapanış adımları atlanabiliyor.',forwhom:'Telefonla, mesajla veya yüz yüze satış yapan işletmeler.',outputs:['Açılış cümlesi','İhtiyaç soruları','İtiraz cevapları','Kapanış çağrısı'],flow:['Ürünü tanımla','Müşteri tipini seç','Sık itirazları gir','Satış senaryosunu oluştur'],benefit:'Satış görüşmesini daha düzenli ve tutarlı hale getirmeyi amaçlar.'},
{name:'WebMetin',cat:'Web',icon:'🖥️',short:'Tek sayfalık web sitesi satış metni.',problem:'Web sitesi güzel olsa bile ne sunduğunu net anlatmıyorsa ziyaretçi hızla çıkabiliyor.',forwhom:'KOBİ, danışman, esnaf ve yeni girişimler.',outputs:['Ana başlık','Değer önerisi','Hizmet bölümleri','Güven ve çağrı metinleri'],flow:['İşletmeyi tanımla','Hedef müşteriyi seç','Ana avantajları gir','Tek sayfalık web metnini al'],benefit:'Web sitesinin ne sunduğunu daha hızlı ve ikna edici anlatmayı hedefler.'}
];const grid=document.getElementById('grid'),q=document.getElementById('q');function render(){const s=(q.value||'').toLocaleLowerCase('tr');const list=products.filter(p=>(p.name+' '+p.cat+' '+p.short+' '+p.forwhom).toLocaleLowerCase('tr').includes(s));document.getElementById('count').textContent=list.length+' çözüm';grid.innerHTML=list.map(p=>`<article class="card" onclick="openDetail('${p.name}')"><div class="icon">${p.icon}</div><div class="cat">${p.cat}</div><h3>${p.name}</h3><p>${p.short}</p><div class="open">Detayları aç →</div></article>`).join('')}function openDetail(name){const p=products.find(x=>x.name===name);document.getElementById('catalog').classList.add('hide');document.getElementById('detail').classList.add('show');document.getElementById('dtitleTop').textContent=p.name;document.getElementById('dcontent').innerHTML=`<section class="dhero"><div class="icon">${p.icon}</div><div class="cat">${p.cat}</div><h1>${p.name}</h1><p>${p.short}</p><div class="meta"><span class="pill">Ödeme yok</span><span class="pill">Ön talep testi</span><span class="pill">Dijital hizmet</span></div></section><div class="blocks"><section class="block"><h3>Hangi sorunu çözer?</h3><p>${p.problem}</p></section><section class="block"><h3>Kimler için?</h3><p>${p.forwhom}</p></section><section class="block"><h3>Ne teslim eder?</h3><ul>${p.outputs.map(x=>'<li>'+x+'</li>').join('')}</ul></section><section class="block"><h3>Nasıl çalışır?</h3><ol>${p.flow.map(x=>'<li>'+x+'</li>').join('')}</ol></section><section class="block wide"><h3>Beklenen fayda</h3><p>${p.benefit}</p></section></div><div class="cta"><div><strong>Bu çözümü gerçek ürüne dönüştürelim mi?</strong><span>Ödeme alınmaz; sadece gerçek talebi ölçmek için ön talep kaydedilir.</span><div class="notice" id="notice">Talebiniz bu cihazda kaydedildi.</div></div><button class="btn" onclick="vote('${p.name}')">Bu çözümü istiyorum</button></div>`;scrollTo(0,0)}function closeDetail(){document.getElementById('detail').classList.remove('show');document.getElementById('catalog').classList.remove('hide');scrollTo(0,0)}function vote(name){const k='demand_'+name;localStorage.setItem(k,(+(localStorage.getItem(k)||0)+1));const n=document.getElementById('notice');n.style.display='block'}render();</script></body></html>
