<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dijital Çözüm Laboratuvarı</title><style>body{font-family:system-ui;margin:0;background:#07111f;color:#eef5ff}.w{max-width:1050px;margin:auto;padding:28px}h1{font-size:34px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.c{background:#101e31;border:1px solid #29415f;border-radius:16px;padding:18px}.p{font-size:24px;font-weight:700}button{background:#35d07f;border:0;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer}.tag{color:#83a7ce}.ok{margin-top:18px;padding:14px;background:#102a20;border-radius:12px}</style></head><body><main class="w"><div class="tag">Sıfır maliyetli gerçek talep testi</div><h1>İşinizi hızlandıran dijital çözümler</h1><p>En çok talep gören çözümü gerçek ürüne dönüştürüyoruz; ödeme alınmıyor, bu sayfa yalnızca pazar talebini ölçer.</p><div class="grid" id="g"></div><div class="ok" id="r">Bir çözümü seçerek ücretsiz ön talep bırakabilirsiniz.</div></main><script>const a=[['TeklifPilot','Müşteriye saniyeler içinde profesyonel teklif taslağı','KOBİ'],['SosyalPaket','30 günlük işletme sosyal medya içerik planı','Pazarlama'],['MenüPilot','Restoran menüsü ve kampanya metni üretici','Restoran'],['Emlakİlan','Daha güçlü emlak ilan metni ve sunum paketi','Emlak'],['CVPilot','CV ve iş başvurusu iyileştirme paketi','Kariyer'],['EsnafAsistan','WhatsApp müşteri cevapları ve satış metinleri','Esnaf'],['Ürünİlan','E-ticaret ürün başlığı ve açıklama paketi','E-ticaret'],['GoogleYorum','Müşteri yorumlarına profesyonel cevap taslakları','İşletme'],['FiyatTeklif','Hizmet işletmeleri için fiyat/teklif şablonları','Hizmet'],['İçerikTakvim','Küçük işletmeler için aylık içerik takvimi','Pazarlama'],['KatalogPilot','Ürün kataloğu metin paketi','Üretici'],['MüşteriTakip','Basit müşteri takip ve hatırlatma sistemi','Satış'],['RandevuMetin','Randevu onay/hatırlatma mesaj paketi','Hizmet'],['İhracatİlan','Türkçe ürünü İngilizce satış sunumuna çevirme','İhracat'],['FirmaProfil','Kurumsal firma tanıtım metni paketi','B2B'],['PazarAnaliz','Rakip ve konumlandırma raporu taslağı','Girişim'],['KampanyaPilot','Kampanya fikri ve reklam metni paketi','Perakende'],['MüşteriSSS','İşletme için hazır soru-cevap merkezi','Destek'],['SatışScript','Telefon/mesaj satış görüşmesi senaryosu','Satış'],['WebMetin','Tek sayfalık web sitesi satış metni','Web']];const g=document.querySelector('#g');a.forEach((x,i)=>{let d=document.createElement('div');d.className='c';d.innerHTML=`<div class=tag>${x[2]}</div><h2>${x[0]}</h2><p>${x[1]}</p><button onclick="vote(${i},'${x[0]}')">Bunu isterim</button>`;g.appendChild(d)});function vote(i,n){let k='demand_'+i,v=+(localStorage.getItem(k)||0)+1;localStorage.setItem(k,v);document.querySelector('#r').textContent='Talebiniz kaydedildi: '+n+' — ödeme alınmadı.'}</script></body></html>
