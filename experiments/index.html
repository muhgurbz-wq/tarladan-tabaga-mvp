<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a2a66"><link rel="manifest" href="manifest.webmanifest"><title>Çözüm Merkezi</title><style>:root{--bg:#f3f6fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e6eaf0;--brand:#0b57d0;--nav:#082657;--soft:#eef4ff;--ok:#067647}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}.phone{max-width:1120px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 50px #0f172a10}.top{position:sticky;top:0;z-index:20;height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#0b57d0,#082657);color:#fff;display:grid;place-items:center}.status{font-size:12px;color:var(--ok);background:#ecfdf3;border:1px solid #abefc6;border-radius:999px;padding:7px 10px}.hero{padding:28px 18px 16px;background:linear-gradient(180deg,#f6f9ff,#fff)}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px);letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);line-height:1.65;max-width:760px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 18px 18px}.q{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left;cursor:pointer}.q b{display:block;margin-top:8px;font-size:13px}.q span{font-size:22px}.section{padding:8px 18px 90px}.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin:12px 0 14px}.sectionTitle h2{margin:0;font-size:21px}.sectionTitle small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff;cursor:pointer;transition:.15s;box-shadow:0 1px 2px #10182808}.card:hover{transform:translateY(-1px);box-shadow:0 12px 28px #10182812}.ic{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px}.cat{color:var(--brand);font-size:11px;font-weight:850;margin-top:12px}.card h3{margin:5px 0 6px}.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.arrow{margin-top:14px;color:var(--brand);font-weight:800;font-size:13px}.detail{display:none;min-height:100vh;background:#fff}.detail.show{display:block}.home.hide{display:none}.dtop{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);height:62px;display:flex;align-items:center;gap:12px;padding:0 16px}.back{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px}.wrap{max-width:900px;margin:auto;padding:24px 16px 100px}.productHead{background:linear-gradient(135deg,#eef4ff,#fff);border:1px solid #d7e4ff;border-radius:22px;padding:22px}.productHead h1{margin:6px 0 8px;font-size:34px}.productHead p{color:var(--muted);line-height:1.65}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{border:1px solid #cfdcff;background:#fff;border-radius:999px;padding:7px 9px;font-size:12px}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.menu button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;font-weight:800;cursor:pointer}.menu button.active{background:var(--nav);color:#fff;border-color:var(--nav)}.panel{display:none}.panel.active{display:block}.block{border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}.block h3{margin:0 0 8px}.block p,.block li{color:var(--muted);line-height:1.65}.steps{counter-reset:s}.steps li{list-style:none;position:relative;padding:0 0 16px 38px}.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--brand);font-weight:850}.actionbar{position:fixed;left:0;right:0;bottom:0;background:#ffffffef;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px;z-index:40}.actioninner{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:13px;padding:14px 16px;font-weight:850;cursor:pointer}.primary{background:var(--brand);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px}.form textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}.note{font-size:12px;color:var(--muted);margin-top:8px}.bottomnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:15}.bn{max-width:1120px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.bn button{border:0;background:#fff;padding:10px 4px;color:var(--muted);font-size:11px}.bn button b{display:block;font-size:19px;color:var(--text);margin-bottom:2px}.installHelp{display:none;padding:12px;border-radius:12px;background:#fff8e8;color:#7c4a03;margin-top:12px}@media(max-width:720px){.quick{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.menu{grid-template-columns:1fr 1fr 1fr}.productHead h1{font-size:29px}.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="phone"><div id="home" class="home"><header class="top"><div class="brand"><div class="logo">Ç</div><span>Çözüm Merkezi</span></div><div class="status">Demo · ödeme yok</div></header><section class="hero"><h1>Tek uygulama, onlarca iş çözümü.</h1><p>Her ürünü gerçek bir mobil uygulama mantığında inceleyin: özellikler, kullanım akışı, teslimatlar, güvenlik, destek ve erişim koşulları ayrı ekranlarda.</p><div id="installHelp" class="installHelp"></div></section><section class="quick"><button class="q" onclick="installApp()"><span>⬇️</span><b>Cihaza kur</b></button><button class="q" onclick="filterCat('Satış')"><span>📈</span><b>Satış araçları</b></button><button class="q" onclick="filterCat('Pazarlama')"><span>🎯</span><b>Pazarlama</b></button><button class="q" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})"><span>🧩</span><b>Tüm çözümler</b></button></section><section class="section" id="products"><div class="sectionTitle"><h2>Çözüm mağazası</h2><small>20 ürün</small></div><div id="grid" class="grid"></div></section><nav class="bottomnav"><div class="bn"><button><b>⌂</b>Ana Sayfa</button><button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})"><b>▦</b>Ürünler</button><button onclick="installApp()"><b>↓</b>Kur</button><button onclick="alert('Hesap ve abonelik yönetimi gerçek backend bağlandıktan sonra aktif olacaktır.')"><b>◉</b>Hesabım</button></div></nav></div><div id="detail" class="detail"><div class="dtop"><button class="back" onclick="closeDetail()">←</button><strong id="topTitle">Ürün</strong></div><main class="wrap" id="content"></main><div class="actionbar"><div class="actioninner"><button class="btn ghost" onclick="installApp()">Cihaza kur</button><button class="btn primary" id="wantBtn">Bu çözümü istiyorum</button></div></div></div></div><script>const P=[['TeklifPilot','KOBİ','📄','Profesyonel teklif hazırlama','Teklifleri standartlaştırır, kapsamı netleştirir ve müşteriye sunuma hazır hale getirir.'],['SosyalPaket','Pazarlama','📱','30 günlük sosyal medya planı','İşletme için konu, gönderi, kampanya ve yayın takvimi oluşturur.'],['MenüPilot','Restoran','🍽️','Menü ve kampanya paketi','Ürün açıklamalarını, kampanya dilini ve menü sunumunu geliştirir.'],['Emlakİlan','Emlak','🏠','Profesyonel emlak ilan paketi','Mülkün avantajlarını güven veren bir ilan yapısına dönüştürür.'],['CVPilot','Kariyer','🧾','CV ve başvuru paketi','CV özeti, deneyim sunumu ve başvuru metnini düzenler.'],['EsnafAsistan','Esnaf','💬','Müşteri mesaj asistanı','Fiyat, randevu, şikâyet ve satış mesajlarını hızlıca hazırlar.'],['Ürünİlan','E-ticaret','🛍️','Ürün satış metni paketi','Başlık, açıklama, fayda ve sık sorulan soruları hazırlar.'],['GoogleYorum','İşletme','⭐','Yorum cevap asistanı','Olumlu ve olumsuz müşteri yorumlarına profesyonel cevap üretir.'],['FiyatTeklif','Hizmet','💼','Fiyat ve paket sunumu','Hizmeti paketler, kapsamı netleştirir ve sunuma hazırlar.'],['İçerikTakvim','Pazarlama','🗓️','Aylık içerik planı','Aylık yayın planı, konu başlıkları ve kampanya günleri oluşturur.'],['KatalogPilot','Üretici','📚','Ürün kataloğu paketi','Ürün özelliklerini satış diliyle katalog metnine dönüştürür.'],['MüşteriTakip','Satış','👥','Müşteri takip sistemi','Müşteri, görüşme, sonraki adım ve hatırlatmaları tek yerde toplar.'],['RandevuMetin','Hizmet','⏰','Randevu mesaj paketi','Onay, hatırlatma, gecikme ve iptal mesajlarını standartlaştırır.'],['İhracatİlan','İhracat','🌍','İngilizce satış sunumu','Türkçe ürün bilgisini dış pazara uygun satış sunumuna dönüştürür.'],['FirmaProfil','B2B','🏢','Kurumsal firma profili','Firma tanıtımı, yetkinlikler, hizmetler ve değer önerisini profesyonel sunar.'],['PazarAnaliz','Girişim','📊','Rakip ve konumlandırma özeti','Rakipleri, hedef müşteriyi ve farklılaşma alanlarını rapora çevirir.'],['KampanyaPilot','Perakende','🎯','Kampanya ve reklam paketi','Kampanya fikri, başlık, teklif ve çağrı metinleri üretir.'],['MüşteriSSS','Destek','❓','Hazır soru-cevap merkezi','Sık sorulan soruları ve müşteri cevaplarını tek merkezde toplar.'],['SatışScript','Satış','☎️','Satış görüşmesi senaryosu','Telefon ve mesaj görüşmeleri için adım adım satış akışı hazırlar.'],['WebMetin','Web','🖥️','Tek sayfalık satış sitesi metni','Başlık, fayda, güven, hizmet ve çağrı bölümlerini hazırlar.']];let current=0;const grid=document.getElementById('grid');function render(list=P){grid.innerHTML='';list.forEach(p=>{const i=P.indexOf(p),e=document.createElement('article');e.className='card';e.onclick=()=>openDetail(i);e.innerHTML=`<div class=ic>${p[2]}</div><div class=cat>${p[1]}</div><h3>${p[0]}</h3><p>${p[4]}</p><div class=arrow>Ürünü aç →</div>`;grid.appendChild(e)})}render();function filterCat(c){render(P.filter(p=>p[1]===c));document.getElementById('products').scrollIntoView({behavior:'smooth'})}function openDetail(i){current=i;const p=P[i];home.classList.add('hide');detail.classList.add('show');topTitle.textContent=p[0];content.innerHTML=`<section class=productHead><div class=cat>${p[1]}</div><h1>${p[2]} ${p[0]}</h1><p>${p[4]}</p><div class=tags><span class=tag>Mobil uyumlu</span><span class=tag>PWA kurulabilir</span><span class=tag>Güncellenebilir</span><span class=tag>Demo erişimi</span></div></section><div class=menu><button class=active onclick="tab(this,'overview')">Genel Bakış</button><button onclick="tab(this,'features')">Özellikler</button><button onclick="tab(this,'access')">Erişim</button></div><section id=overview class='panel active'><div class=block><h3>Ne işe yarar?</h3><p>${p[4]}</p></div><div class=block><h3>Nasıl kullanılır?</h3><ol class=steps><li>Uygulamayı açın ve ihtiyacınızı seçin.</li><li>Gerekli müşteri veya iş bilgilerini girin.</li><li>Sistem düzenli çıktıyı hazırlasın.</li><li>Sonucu kontrol edin, kopyalayın, indirin veya paylaşın.</li></ol></div><div class=block><h3>Size ne teslim eder?</h3><ul><li>Kullanıma hazır profesyonel çıktı</li><li>Tekrar kullanılabilir kayıt ve şablon yapısı</li><li>Mobil cihazdan hızlı erişim</li><li>Gelecek sürümlerde hesabınıza bağlı geçmiş işlemler</li></ul></div></section><section id=features class=panel><div class=block><h3>Ürün özellikleri</h3><ul><li>Adım adım yönlendirilmiş iş akışı</li><li>Mobil öncelikli sade ekranlar</li><li>Çıktıyı kopyalama / dışa aktarma yapısı</li><li>Uygulama gibi ana ekrana kurulabilme</li><li>Yeni özelliklerin merkezi güncellenebilmesi</li><li>Destek ve talep kanalının ürün içine gömülmesi</li></ul></div><div class=block><h3>Güven ve şeffaflık</h3><p>Bu sürüm pazar doğrulama demosudur; ödeme alınmaz. Gerçek abonelik, kullanıcı hesabı, sunucu tarafı erişim kontrolü ve faturalandırma ancak talep doğrulandıktan sonra güvenli backend ile bağlanacaktır.</p></div></section><section id=access class=panel><div class=block><h3>Kurulum</h3><p>Tarayıcı destekliyorsa tek dokunuşla PWA olarak telefona kurulabilir; aksi durumda tarayıcı menüsündeki “Ana ekrana ekle / Uygulamayı yükle” seçeneği kullanılır.</p><button class='btn ghost' onclick='installApp()'>Cihaza kur</button></div><div class=block><h3>Hesap ve abonelik</h3><p>Profesyonel son yapıda her müşteri kendi hesabıyla giriş yapacak; aktif planı, kullanım hakkı, geçmiş işlemleri, plan değişikliği ve iptal durumu sunucu tarafından yönetilecek. Şu an ödeme bağlanmadığı için sahte bir abonelik görüntüsü göstermiyoruz.</p></div><div class=block><h3>Bu ürünü talep et</h3><form action='https://formsubmit.co/muh.gurbz@gmail.com' method='POST'><input type=hidden name='_subject' value='Yeni ürün talebi'><input type=hidden name='_captcha' value='false'><input type=hidden name='Ürün' value='${p[0]}'><input type=hidden name='_next' value='https://muhgurbz-wq.github.io/tarladan-tabaga-mvp/experiments/?talep=alindi'><div class=form><input required name='Ad Soyad' placeholder='Ad Soyad'><input required type=email name='E-posta' placeholder='E-posta'><input name='Telefon' placeholder='Telefon / WhatsApp'><input name='Firma' placeholder='Firma / İşletme'><textarea class=full name='İhtiyaç' placeholder='Bu ürünü ne için kullanacağınızı kısaca yazın'></textarea><button class='btn primary full' type=submit>Talebi gönder</button></div></form><div class=note>Talep seçilen ürün adı ve iletişim bilgilerinizle birlikte bize e-posta bildirimi olarak iletilir.</div></div></section>`;wantBtn.onclick=()=>{document.querySelectorAll('.menu button')[2].click();document.querySelector('#access .block:last-child').scrollIntoView({behavior:'smooth'})};scrollTo(0,0)}function tab(btn,id){document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}function closeDetail(){detail.classList.remove('show');home.classList.remove('hide');render();scrollTo(0,0)}let deferred;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});async function installApp(){if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}else{installHelp.style.display='block';installHelp.textContent=/iphone|ipad|ipod/i.test(navigator.userAgent)?'iPhone/iPad: Paylaş menüsünden “Ana Ekrana Ekle” seçeneğini kullanın.':'Tarayıcı menüsünden “Uygulamayı yükle” veya “Ana ekrana ekle” seçeneğini kullanın.';scrollTo(0,0)}}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');if(new URLSearchParams(location.search).get('talep')==='alindi'){installHelp.style.display='block';installHelp.textContent='Talebiniz başarıyla alındı.'}</script></body></html>
