<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2a63"><link rel="manifest" href="manifest.webmanifest"><title>Çözüm Merkezi</title><style>:root{--bg:#f4f7fb;--card:#fff;--text:#111827;--muted:#667085;--line:#e4e7ec;--brand:#155eef;--nav:#0b2a63;--soft:#eef4ff;--ok:#067647;--warn:#b54708}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}button,input,textarea{font:inherit}button{touch-action:manipulation}.shell{max-width:1180px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:30;height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:#ffffffef;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#175cd3,#0b2a63);color:#fff;display:grid;place-items:center}.status{font-size:12px;color:var(--ok);background:#ecfdf3;border:1px solid #abefc6;padding:7px 10px;border-radius:999px}.hero{padding:30px 18px 18px;background:linear-gradient(180deg,#f6f9ff,#fff)}.hero h1{margin:0 0 8px;font-size:clamp(30px,5vw,46px);letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);line-height:1.65;max-width:850px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:850;cursor:pointer}.primary{background:var(--brand);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 18px 18px}.q{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left;cursor:pointer}.q b{display:block;margin-top:8px;font-size:13px}.section{padding:10px 18px 96px}.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:12px 0 14px}.sectionTitle h2{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:18px;padding:17px;background:#fff;cursor:pointer;box-shadow:0 1px 2px #10182808}.card:active{transform:scale(.995)}.ic{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:21px}.cat{font-size:11px;color:var(--brand);font-weight:850;margin-top:12px}.card h3{margin:5px 0 7px}.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.arrow{margin-top:14px;color:var(--brand);font-weight:850;font-size:13px}.detail{display:none;min-height:100vh}.detail.show{display:block}.home.hide{display:none}.dtop{position:sticky;top:0;z-index:35;height:62px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}.back{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;cursor:pointer}.wrap{max-width:940px;margin:auto;padding:24px 16px 122px}.head{border:1px solid #d1e0ff;background:linear-gradient(135deg,#eef4ff,#fff);border-radius:24px;padding:23px}.head h1{margin:6px 0 8px;font-size:34px}.head p{color:var(--muted);line-height:1.65}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{border:1px solid #cfdcff;background:#fff;border-radius:999px;padding:7px 9px;font-size:12px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font-weight:850;cursor:pointer}.tabs button.active{background:var(--nav);color:#fff;border-color:var(--nav)}.panel{display:none}.panel.active{display:block}.block{border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px;background:#fff}.block h3{margin:0 0 9px}.block p,.block li{color:var(--muted);line-height:1.65}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.field textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}.output{white-space:pre-wrap;border:1px dashed #98a2b3;background:#fafafa;border-radius:14px;padding:16px;min-height:150px;line-height:1.6}.toolActions{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.accordion{margin-top:12px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.accHead{width:100%;border:0;background:#fff;padding:16px;display:flex;justify-content:space-between;text-align:left;font-weight:850;cursor:pointer}.accBody{display:none;padding:0 16px 16px;color:var(--muted);line-height:1.65}.accordion.open .accBody{display:block}.checkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.check{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;gap:10px;align-items:flex-start}.check b{display:block}.dot{width:11px;height:11px;border-radius:50%;background:#12b76a;margin-top:5px;flex:0 0 auto}.installCards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.installCard{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.installCard b{display:block;margin-bottom:6px}.small{font-size:12px;color:var(--muted);line-height:1.5}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#ffffffef;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px}.bottomIn{max-width:940px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.bottomnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20}.bn{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.bn button{border:0;background:#fff;padding:10px 4px;color:var(--muted);font-size:11px}.bn button b{display:block;font-size:18px;color:var(--text);margin-bottom:2px}.modal{position:fixed;inset:0;z-index:100;display:none;background:#0f172a88;padding:18px;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(560px,100%);background:#fff;border-radius:24px 24px 16px 16px;padding:20px;box-shadow:0 30px 90px #0004}.sheet h2{margin:0 0 8px}.sheet p{color:var(--muted);line-height:1.6}.steps{padding-left:22px;color:var(--muted);line-height:1.7}.diag{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-top:1px solid var(--line)}.ok{color:var(--ok);font-weight:850}.warn{color:var(--warn);font-weight:850}@media(max-width:760px){.quick{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}.workspace,.installCards,.checkgrid{grid-template-columns:1fr}.full{grid-column:auto}.head h1{font-size:29px}.bottomIn{grid-template-columns:1fr 1fr}}</style></head><body><div class="shell"><div id="home" class="home"><header class="top"><div class="brand"><div class="logo">Ç</div><span>Çözüm Merkezi</span></div><div class="status">Canlı demo</div></header><section class="hero"><h1>Gerçek çalışan çözüm mağazası.</h1><p>Her ürünü açın, çalışma alanında deneyin, ayrıntıları etkileşimli olarak inceleyin, çıktıyı indirin ve desteklenen cihazlarda uygulama olarak kurun.</p><div class="actions"><button class="btn primary" data-install>Bu cihaza kur</button><button class="btn ghost" onclick="document.getElementById('products').scrollIntoView()">Ürünleri incele</button></div></section><section class="quick"><button class="q" data-install>⬇️<b>Telefon / PC kurulum</b></button><button class="q" data-cat="Satış">📈<b>Satış</b></button><button class="q" data-cat="Pazarlama">🎯<b>Pazarlama</b></button><button class="q" data-all>🧩<b>Tüm ürünler</b></button></section><section class="section" id="products"><div class="sectionTitle"><h2>Çözüm mağazası</h2><small>20 ürün</small></div><div id="grid" class="grid"></div></section><nav class="bottomnav"><div class="bn"><button onclick="scrollTo(0,0)"><b>⌂</b>Ana Sayfa</button><button onclick="document.getElementById('products').scrollIntoView()"><b>▦</b>Ürünler</button><button data-install><b>↓</b>Kur</button><button onclick="openAccount()"><b>◉</b>Hesabım</button></div></nav></div><div id="detail" class="detail"><div class="dtop"><button class="back" id="backBtn">←</button><strong id="topTitle">Ürün</strong></div><main class="wrap" id="content"></main><div class="bottom"><div class="bottomIn"><button class="btn ghost" data-install>Cihaza kur</button><button class="btn primary" id="requestBtn">Bu çözümü istiyorum</button></div></div></div></div><div class="modal" id="installModal"><div class="sheet"><h2 id="installTitle">Uygulamayı kur</h2><p id="installText"></p><ol class="steps" id="installSteps"></ol><div id="diag"></div><div class="actions"><button class="btn primary" id="nativeInstallBtn" style="display:none">Kurulumu başlat</button><button class="btn ghost" id="closeInstall">Kapat</button></div></div></div><script>const PRODUCTS=[['TeklifPilot','KOBİ','📄','Profesyonel teklif hazırlama','Müşteri / firma','Hizmet veya iş','Fiyat / bütçe'],['SosyalPaket','Pazarlama','📱','30 günlük sosyal medya planı','İşletme / marka','Sektör','Hedef müşteri'],['MenüPilot','Restoran','🍽️','Menü ve kampanya paketi','İşletme adı','Ürün / yemek','Öne çıkan özellik'],['Emlakİlan','Emlak','🏠','Profesyonel emlak ilan paketi','Mülk türü','Konum','Öne çıkan özellikler'],['CVPilot','Kariyer','🧾','CV ve başvuru paketi','Ad Soyad','Hedef pozisyon','Deneyim / beceriler'],['EsnafAsistan','Esnaf','💬','Müşteri mesaj asistanı','Müşteri adı','Konu','Verilecek bilgi'],['Ürünİlan','E-ticaret','🛍️','Ürün satış metni paketi','Ürün adı','Hedef müşteri','Temel fayda'],['GoogleYorum','İşletme','⭐','Yorum cevap asistanı','Müşteri adı','Yorum özeti','Yanıt amacı'],['FiyatTeklif','Hizmet','💼','Fiyat ve paket sunumu','Hizmet','Başlangıç fiyatı','Dahil olanlar'],['İçerikTakvim','Pazarlama','🗓️','Aylık içerik planı','Marka','Ana hedef','Platform'],['KatalogPilot','Üretici','📚','Ürün kataloğu paketi','Firma','Ürün','Teknik özellik / fayda'],['MüşteriTakip','Satış','👥','Müşteri takip sistemi','Müşteri','Son görüşme','Sonraki adım'],['RandevuMetin','Hizmet','⏰','Randevu mesaj paketi','Müşteri','Tarih / saat','Hizmet'],['İhracatİlan','İhracat','🌍','İngilizce satış sunumu','Product name','Target market','Main advantage'],['FirmaProfil','B2B','🏢','Kurumsal firma profili','Firma adı','Faaliyet alanı','Temel güç'],['PazarAnaliz','Girişim','📊','Rakip ve konumlandırma özeti','Ürün / fikir','Hedef müşteri','Farklılaşma'],['KampanyaPilot','Perakende','🎯','Kampanya ve reklam paketi','Ürün / hizmet','Kampanya','Hedef müşteri'],['MüşteriSSS','Destek','❓','Hazır soru-cevap merkezi','İşletme','Soru','Cevap bilgisi'],['SatışScript','Satış','☎️','Satış görüşmesi senaryosu','Ürün / hizmet','Müşteri ihtiyacı','Ana fayda'],['WebMetin','Web','🖥️','Tek sayfalık satış sitesi metni','Marka / ürün','Hedef müşteri','Ana vaat']].map(x=>({name:x[0],cat:x[1],icon:x[2],desc:x[3],fields:x.slice(4)}));let current=0,installPrompt=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function render(list=PRODUCTS){$('#grid').innerHTML=list.map((p,i)=>`<article class="card" data-open="${p.name}"><div class="ic">${p.icon}</div><div class="cat">${p.cat}</div><h3>${p.name}</h3><p>${p.desc}</p><div class="arrow">Uygulamayı aç →</div></article>`).join('');$$('[data-open]').forEach(el=>el.onclick=()=>openProduct(el.dataset.open))}function openProduct(name){current=PRODUCTS.findIndex(p=>p.name===name);const p=PRODUCTS[current];$('#home').classList.add('hide');$('#detail').classList.add('show');$('#topTitle').textContent=p.name;$('#content').innerHTML=`<section class="head"><div class="cat">${p.cat}</div><h1>${p.icon} ${p.name}</h1><p>${p.desc}</p><div class="tags"><span class="tag">Çalışan demo</span><span class="tag">Mobil + bilgisayar</span><span class="tag">Tekrar indirilebilir</span><span class="tag">Çevrimdışı destek</span></div></section><div class="tabs"><button data-tab="work" class="active">Çalışma Alanı</button><button data-tab="details">Detaylar</button><button data-tab="install">Kurulum</button><button data-tab="request">Erişim</button></div><section id="work" class="panel active"><div class="block"><h3>Ürünü şimdi deneyin</h3><div class="workspace"><div class="field"><label>${p.fields[0]}</label><input id="f1" placeholder="${p.fields[0]}"></div><div class="field"><label>${p.fields[1]}</label><input id="f2" placeholder="${p.fields[1]}"></div><div class="field full"><label>${p.fields[2]}</label><textarea id="f3" placeholder="${p.fields[2]}"></textarea></div><div class="full"><button class="btn primary" id="generateBtn">Profesyonel çıktıyı oluştur</button></div><div class="output full" id="out">Bilgileri girin ve çıktıyı oluşturun.</div><div class="toolActions full"><button class="btn ghost" id="copyBtn">Kopyala</button><button class="btn ghost" id="downloadBtn">Dosya indir</button><button class="btn ghost" id="shareBtn">Paylaş</button></div></div></div></section><section id="details" class="panel"><div class="block"><h3>Ürünün tam çalışma modeli</h3><div class="checkgrid"><div class="check"><span class="dot"></span><div><b>Girdi</b><span class="small">${p.fields.join(' · ')}</span></div></div><div class="check"><span class="dot"></span><div><b>İşleme</b><span class="small">Bilgiler ürüne özel iş akışına dönüştürülür.</span></div></div><div class="check"><span class="dot"></span><div><b>Çıktı</b><span class="small">Kopyalanabilir, indirilebilir ve paylaşılabilir sonuç.</span></div></div><div class="check"><span class="dot"></span><div><b>Tekrar kullanım</b><span class="small">Aynı araç yeni verilerle sınırsız yeniden çalıştırılabilir.</span></div></div></div></div>${acc('1. Kullanıcı tam olarak ne yapar?',`Kullanıcı ${p.fields.join(', ')} bilgilerini girer. “Profesyonel çıktıyı oluştur” düğmesi ürüne özel sonucu anında üretir.`)}${acc('2. Sonuç nasıl kullanılır?','Sonuç ekranda kalmaz: kopyalanabilir, TXT dosyası olarak tekrar tekrar indirilebilir ve desteklenen cihazlarda paylaşım menüsüne gönderilebilir.')}${acc('3. Mobil kullanım nasıl çalışır?','Ekran telefon boyutuna uyarlanır; dokunmatik düğmeler ve alt menü mobil kullanım için ayrı düzenlenir. Kurulu PWA bağımsız uygulama penceresinde açılır.')}${acc('4. Çevrimdışı kullanım ne sağlar?','İlk başarılı yüklemeden sonra temel uygulama kabuğu ve ürün arayüzü önbellekte tutulur. Ağ kesildiğinde boş logo yerine uygulama arayüzü açılır.')}${acc('5. Merkezi kontrol ne durumda?','Bu doğrulama sürümünde ödeme ve uzaktan lisans yönetimi bağlı değildir. Gerçek backend bağlandığında kullanıcı hesabı, erişim açma-kapama ve abonelik denetimi sunucu tarafında yapılacaktır.')}</section><section id="install" class="panel"><div class="block"><h3>Telefon ve bilgisayara kurulum</h3><div class="installCards"><div class="installCard"><b>Android</b><span class="small">Chrome/Edge destekliyorsa yerel PWA kurulum penceresi açılır. Desteklemiyorsa cihazınıza uygun adımlar gösterilir.</span></div><div class="installCard"><b>iPhone / iPad</b><span class="small">Safari Paylaş → Ana Ekrana Ekle. iOS, web sayfasının programatik olarak sessiz kurulmasına izin vermez.</span></div><div class="installCard"><b>Windows / macOS</b><span class="small">Chrome/Edge uygulama yükleme penceresiyle ayrı masaüstü uygulaması olarak kurulur.</span></div></div><div class="actions"><button class="btn primary" data-install>Bu cihaza kur</button><button class="btn ghost" id="checkInstall">Kurulumu doğrula</button></div><div id="installCheck" class="small"></div></div></section><section id="request" class="panel"><div class="block"><h3>${p.name} erişim talebi</h3><p>Gerçek talebi ölçmek için ürün adıyla erken erişim talebi gönderilebilir. Ödeme şu an bağlı değildir.</p><form action="https://formsubmit.co/muh.gurbz@gmail.com" method="POST"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="_subject" value="[${p.name}] Yeni erken erişim talebi"><input type="hidden" name="Ürün" value="${p.name}"><div class="workspace"><div class="field"><label>Ad Soyad</label><input required name="Ad Soyad"></div><div class="field"><label>E-posta</label><input required type="email" name="E-posta"></div><div class="field full"><label>İhtiyaç</label><textarea name="İhtiyaç"></textarea></div><button class="btn primary full" type="submit">Talebi gönder</button></div></form></div></section>`;bindProduct();setHash('work');scrollTo(0,0)}function bindProduct(){$$('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));$$('[data-install]').forEach(b=>b.onclick=openInstall);$('#generateBtn').onclick=generate;$('#copyBtn').onclick=copyOut;$('#downloadBtn').onclick=downloadOut;$('#shareBtn').onclick=shareOut;$('#checkInstall').onclick=checkInstall}function showTab(id){$$('.panel').forEach(p=>p.classList.remove('active'));$('#'+id)?.classList.add('active');$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));setHash(id);document.querySelector('.tabs')?.scrollIntoView({block:'start'})}function setHash(tab){history.replaceState(null,'',`#product=${encodeURIComponent(PRODUCTS[current]?.name||'')}&tab=${tab}`)}function acc(h,b){return `<div class="accordion"><button class="accHead"><span>${h}</span><span>＋</span></button><div class="accBody">${b}</div></div>`}document.addEventListener('click',e=>{const h=e.target.closest('.accHead');if(h)h.parentElement.classList.toggle('open')});function generate(){const p=PRODUCTS[current],a=$('#f1').value.trim()||'—',b=$('#f2').value.trim()||'—',c=$('#f3').value.trim()||'—';$('#out').textContent=`${p.name.toUpperCase()}\n\n${p.fields[0]}: ${a}\n${p.fields[1]}: ${b}\n${p.fields[2]}: ${c}\n\nSONUÇ\n${p.desc}. Girilen bilgiler doğrultusunda uygulanabilir bir çalışma taslağı oluşturuldu.\n\nSonraki adım: sonucu kontrol edin, gerekiyorsa düzenleyin ve müşteriniz/ekibinizle paylaşın.`}async function copyOut(){try{await navigator.clipboard.writeText($('#out').textContent);alert('Çıktı kopyalandı.')}catch{alert('Kopyalama bu tarayıcıda engellendi. Metni seçip kopyalayabilirsiniz.')}}function downloadOut(){const t=$('#out').textContent;if(!t||t.startsWith('Bilgileri'))generate();const blob=new Blob([$('#out').textContent],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${PRODUCTS[current].name}-${Date.now()}.txt`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}async function shareOut(){const text=$('#out').textContent;if(navigator.share){try{await navigator.share({title:PRODUCTS[current].name,text})}catch{}}else copyOut()}function closeProduct(){location.hash='';$('#detail').classList.remove('show');$('#home').classList.remove('hide');render();scrollTo(0,0)}$('#backBtn').onclick=closeProduct;$('#requestBtn').onclick=()=>showTab('request');function deviceInfo(){const ua=navigator.userAgent.toLowerCase();if(/iphone|ipad|ipod/.test(ua))return'ios';if(/android/.test(ua))return'android';return'desktop'}function openInstall(){const d=deviceInfo(),installed=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;$('#installModal').classList.add('show');$('#nativeInstallBtn').style.display=installPrompt&&!installed?'inline-block':'none';if(installed){$('#installTitle').textContent='Uygulama zaten kurulu';$('#installText').textContent='Bu cihaz uygulamayı bağımsız modda çalıştırıyor.';$('#installSteps').innerHTML=''}else if(installPrompt){$('#installTitle').textContent='Kurulum hazır';$('#installText').textContent='Tarayıcı bu uygulamanın kurulabilir olduğunu doğruladı.';$('#installSteps').innerHTML='<li>Kurulumu başlat düğmesine dokunun.</li><li>Tarayıcının kurulum penceresinde onaylayın.</li>'}else if(d==='ios'){$('#installTitle').textContent='iPhone / iPad kurulumu';$('#installText'
