<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2a63"><link rel="manifest" href="manifest.webmanifest"><title>Çözüm Merkezi</title>
<style>
:root{--b:#155eef;--n:#0b2a63;--bg:#f5f7fb;--t:#101828;--m:#667085;--l:#e4e7ec;--g:#067647}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}button,input,textarea{font:inherit}.app{max-width:1100px;margin:auto;min-height:100vh;background:#fff}.top{height:64px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fffffff2;border-bottom:1px solid var(--l);backdrop-filter:blur(12px)}.brand{font-weight:900}.pill{font-size:12px;color:var(--g);background:#ecfdf3;padding:7px 10px;border-radius:999px}.hero{padding:30px 18px;background:linear-gradient(180deg,#eef4ff,#fff)}h1,h2,h3,p{margin-top:0}.hero h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.04em}.muted{color:var(--m);line-height:1.6}.grid{padding:18px 18px 100px;display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.card,.box{border:1px solid var(--l);border-radius:20px;background:#fff}.card{padding:18px;text-align:left;cursor:pointer}.card:active{transform:scale(.99)}.ico{font-size:26px}.cat{font-size:12px;font-weight:900;color:var(--b);margin:10px 0 5px}.card p{color:var(--m);line-height:1.5}.go{color:var(--b);font-weight:900}.detail{display:none}.detail.on{display:block}.home.off{display:none}.dtop{height:62px;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid var(--l)}.back,.btn,.tab,.acc{border:0;cursor:pointer}.back{background:#fff;border:1px solid var(--l);border-radius:12px;padding:10px 13px}.wrap{max-width:900px;margin:auto;padding:20px 16px 120px}.productHead{padding:22px;border:1px solid #c7d7fe;border-radius:24px;background:linear-gradient(135deg,#eef4ff,#fff)}.productHead h1{font-size:34px;margin-bottom:8px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:12px;border:1px solid #c7d7fe;background:#fff;padding:7px 9px;border-radius:999px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.tab{padding:14px 8px;border:1px solid var(--l);border-radius:14px;background:#fff;font-weight:850}.tab.on{background:var(--n);color:#fff}.panel{display:none}.panel.on{display:block}.box{padding:18px;margin-top:12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}.field input,.field textarea{width:100%;padding:13px;border:1px solid var(--l);border-radius:12px}.field textarea{min-height:100px}.full{grid-column:1/-1}.btn{padding:14px 16px;border-radius:14px;font-weight:900}.primary{background:var(--b);color:#fff}.ghost{background:#fff;border:1px solid var(--l)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.preview{min-height:190px;padding:18px;border:1px solid var(--l);border-radius:16px;background:#fafafa;line-height:1.65}.preview h2{margin-bottom:4px}.preview .line{padding:10px 0;border-bottom:1px solid var(--l)}.accWrap{border:1px solid var(--l);border-radius:16px;margin-top:10px;overflow:hidden}.acc{width:100%;padding:16px;background:#fff;display:flex;justify-content:space-between;font-weight:900;text-align:left}.accBody{display:none;padding:0 16px 16px;color:var(--m);line-height:1.65}.accWrap.open .accBody{display:block}.steps{display:grid;gap:10px}.step{display:grid;grid-template-columns:38px 1fr;gap:10px;padding:14px;border:1px solid var(--l);border-radius:16px}.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#eef4ff;color:var(--b);font-weight:900}.installGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.installCard{padding:16px;border:1px solid var(--l);border-radius:16px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 14px;background:#fffffff2;border-top:1px solid var(--l);backdrop-filter:blur(12px)}.bottomIn{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal{display:none;position:fixed;inset:0;z-index:100;background:#10182899;align-items:flex-end;justify-content:center;padding:16px}.modal.on{display:flex}.sheet{width:min(560px,100%);background:#fff;border-radius:24px;padding:20px}.notice{padding:12px;border-radius:12px;background:#f2f4f7;color:var(--m);margin-top:10px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#101828;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:200}.toast.on{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}.tabs{grid-template-columns:1fr 1fr}.form,.installGrid{grid-template-columns:1fr}.full{grid-column:auto}.productHead h1{font-size:29px}}
</style></head><body><div class="app"><div id="home" class="home"><header class="top"><div class="brand">Çözüm Merkezi</div><div class="pill">Çalışan demo</div></header><section class="hero"><h1>Dijital iş araçları.</h1><p class="muted">Ürünü açın, gerçek alanlarda deneyin, ayrıntıları inceleyin, sonucu düzgün Türkçe karakterlerle profesyonel belge olarak indirin veya PDF kaydedin.</p><div class="actions"><button class="btn primary" onclick="openOrInstall()">Aç / Kur</button></div></section><main id="grid" class="grid"></main></div><div id="detail" class="detail"><header class="dtop"><button class="back" onclick="closeProduct()">←</button><strong id="topTitle"></strong></header><main id="content" class="wrap"></main><div class="bottom"><div class="bottomIn"><button class="btn ghost" onclick="openOrInstall()">Aç / Kur</button><button class="btn primary" onclick="showTab('access')">Bu çözümü istiyorum</button></div></div></div></div><div id="installModal" class="modal"><div class="sheet"><h2>Uygulamayı açın veya kurun</h2><div id="installBody"></div><div class="actions"><button id="nativeInstall" class="btn primary" style="display:none">Kurulumu başlat</button><button class="btn ghost" onclick="closeInstall()">Kapat</button></div></div></div><div id="toast" class="toast"></div>
<script>
const RAW=[['TeklifPilot','KOBİ','📄','Profesyonel müşteri teklifi'],['SosyalPaket','Pazarlama','📱','30 günlük sosyal medya planı'],['MenüPilot','Restoran','🍽️','Menü ve kampanya paketi'],['Emlakİlan','Emlak','🏠','Profesyonel emlak ilanı'],['CVPilot','Kariyer','🧾','CV ve başvuru paketi'],['EsnafAsistan','Esnaf','💬','Müşteri mesaj asistanı'],['Ürünİlan','E-ticaret','🛍️','Ürün satış sayfası'],['GoogleYorum','İşletme','⭐','Müşteri yorumu cevapları'],['FiyatTeklif','Hizmet','💼','Fiyat ve paket sunumu'],['İçerikTakvim','Pazarlama','🗓️','Aylık içerik takvimi'],['KatalogPilot','Üretici','📚','Ürün katalog içeriği'],['MüşteriTakip','Satış','👥','Müşteri takip planı'],['RandevuMetin','Hizmet','⏰','Randevu mesaj paketi'],['İhracatİlan','İhracat','🌍','İngilizce ürün sunumu'],['FirmaProfil','B2B','🏢','Kurumsal firma profili'],['PazarAnaliz','Girişim','📊','Pazar ve konumlandırma özeti'],['KampanyaPilot','Perakende','🎯','Kampanya ve reklam paketi'],['MüşteriSSS','Destek','❓','Soru-cevap merkezi'],['SatışScript','Satış','☎️','Satış görüşmesi senaryosu'],['WebMetin','Web','🖥️','Satış odaklı web metni']];
const FIELDS={TeklifPilot:['Müşteri / firma','Hizmet veya iş','Fiyat / bütçe'],SosyalPaket:['İşletme / marka','Sektör','Hedef müşteri'],MenüPilot:['İşletme adı','Ürün / yemek','Öne çıkan özellik'],Emlakİlan:['Mülk türü','Konum','Öne çıkan özellikler'],CVPilot:['Ad Soyad','Hedef pozisyon','Deneyim / beceriler']};
const P=RAW.map(x=>({name:x[0],cat:x[1],icon:x[2],desc:x[3],fields:FIELDS[x[0]]||['İşletme / ürün','Hedef / ihtiyaç','Ayrıntılar']}));let current=0,installPrompt=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),1800)}
function render(){$('#grid').innerHTML=P.map(p=>`<button class="card" onclick="openProduct('${p.name}')"><div class="ico">${p.icon}</div><div class="cat">${p.cat}</div><h3>${p.name}</h3><p>${p.desc}</p><div class="go">Uygulamayı aç →</div></button>`).join('')}
function openProduct(name){current=P.findIndex(p=>p.name===name);const p=P[current];$('#home').classList.add('off');$('#detail').classList.add('on');$('#topTitle').textContent=p.name;$('#content').innerHTML=`<section class="productHead"><div class="cat">${p.cat}</div><h1>${p.icon} ${p.name}</h1><p class="muted">${p.desc}</p><div class="chips"><span class="chip">Etkileşimli</span><span class="chip">Mobil + PC</span><span class="chip">HTML belge</span><span class="chip">PDF çıktısı</span></div></section><nav class="tabs"><button class="tab on" data-tab="work">Çalışma Alanı</button><button class="tab" data-tab="details">Detaylar</button><button class="tab" data-tab="install">Kurulum</button><button class="tab" data-tab="access">Erişim</button></nav><section id="work" class="panel on"><div class="box"><h3>Yeni çalışma</h3><div class="form">${p.fields.map((f,i)=>`<div class="field ${i===2?'full':''}"><label>${f}</label>${i===2?`<textarea id="f${i}" placeholder="${f}"></textarea>`:`<input id="f${i}" placeholder="${f}">`}</div>`).join('')}<button class="btn primary full" onclick="generate()">Çıktıyı oluştur</button></div></div><div class="box"><h3>Canlı önizleme</h3><div id="preview" class="preview"><p class="muted">Bilgileri girip “Çıktıyı oluştur” düğmesine dokunun.</p></div><div class="actions"><button class="btn ghost" onclick="copyOutput()">Kopyala</button><button class="btn ghost" onclick="downloadHTML()">Belge indir</button><button class="btn ghost" onclick="printPDF()">PDF / Yazdır</button><button class="btn ghost" onclick="shareOutput()">Paylaş</button></div></div></section><section id="details" class="panel"><div class="box"><h3>Nasıl çalışır?</h3><div class="steps"><div class="step"><div class="num">1</div><div><b>Bilgileri girin</b><div class="muted">${p.fields.join(', ')} alanlarını doldurun.</div></div></div><div class="step"><div class="num">2</div><div><b>Sonucu üretin</b><div class="muted">Araç bilgileri düzenli bir iş çıktısına dönüştürür.</div></div></div><div class="step"><div class="num">3</div><div><b>Kullanın</b><div class="muted">Önizleyin, kopyalayın, HTML belge indirin, PDF kaydedin veya paylaşın.</div></div></div></div></div>${acc('Üretilen çıktı nedir?',`${p.name}, ${p.desc.toLowerCase()} için girilen verileri başlıklar ve uygulanabilir sonraki adımla düzenler.`)}${acc('İndirme neden değiştirildi?','Eski TXT yöntemi bazı Android görüntüleyicilerinde UTF-8 kodlamasını yanlış algılayıp Türkçe karakterleri bozuyordu. Yeni indirme, UTF-8 BOM + HTML meta charset kullanan tarayıcı uyumlu belge üretir.')}${acc('Tekrar indirilebilir mi?','Evet. Her indirme zaman damgalı ayrı dosya üretir; önceki dosyanın üzerine yazmaz.')}${acc('Telefon ve bilgisayarda çalışır mı?','Evet. Arayüz responsive çalışır. Desteklenen tarayıcılarda PWA olarak kurulabilir; ayrıca çıktı HTML belgesi ve PDF olarak kullanılabilir.')}</section><section id="install" class="panel"><div class="box"><h3>Aç / Kur</h3><div class="installGrid"><div class="installCard"><b>Android</b><p class="muted">Kuruluysa uygulama bağlantısı açılmayı dener; değilse Chrome/Edge PWA kurulumu gösterilir.</p></div><div class="installCard"><b>iPhone / iPad</b><p class="muted">Kurulu bağlantı açılmayı dener; kurulum gerekirse Safari → Paylaş → Ana Ekrana Ekle.</p></div><div class="installCard"><b>Windows / macOS</b><p class="muted">Kurulu uygulama bağlantısı açılmayı dener; değilse Chrome/Edge kurulum yolu gösterilir.</p></div></div><button class="btn primary" onclick="openOrInstall()">Aç / Kur</button></div></section><section id="access" class="panel"><div class="box"><h3>${p.name} erişim talebi</h3><p class="muted">Ödeme bağlı değildir. Bu alan yalnız gerçek talebi ölçmek içindir.</p><form action="https://formsubmit.co/muh.gurbz@gmail.com" method="POST"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="Ürün" value="${p.name}"><div class="form"><div class="field"><label>Ad Soyad</label><input required name="Ad Soyad"></div><div class="field"><label>E-posta</label><input required type="email" name="E-posta"></div><div class="field full"><label>İhtiyaç</label><textarea name="İhtiyaç"></textarea></div><button class="btn primary full">Talebi gönder</button></div></form></div></section>`;$$('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));scrollTo(0,0)}
function acc(h,b){return `<div class="accWrap"><button class="acc" onclick="this.parentElement.classList.toggle('open')"><span>${h}</span><span>＋</span></button><div class="accBody">${b}</div></div>`}function showTab(id){$$('.panel').forEach(x=>x.classList.remove('on'));$('#'+id)?.classList.add('on');$$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===id));document.querySelector('.tabs')?.scrollIntoView({block:'start'})}function closeProduct(){$('#detail').classList.remove('on');$('#home').classList.remove('off');scrollTo(0,0)}
function values(){return [0,1,2].map(i=>$('#f'+i)?.value.trim()||'—')}function generate(){const p=P[current],v=values();$('#preview').innerHTML=`<div class="cat">${p.cat}</div><h2>${p.name}</h2><p>${p.desc}</p>${p.fields.map((f,i)=>`<div class="line"><b>${esc(f)}</b><br>${esc(v[i])}</div>`).join('')}<div class="line"><b>Sonraki adım</b><br>Bilgileri kontrol edin, gerekli düzenlemeleri yapın ve ilgili kişiyle paylaşın.</div>`;toast('Çıktı hazır')}
function ensure(){if($('#preview')?.textContent.includes('Bilgileri girip'))generate()}function plain(){ensure();return $('#preview').innerText}async function copyOutput(){try{await navigator.clipboard.writeText(plain());toast('Kopyalandı')}catch{toast('Kopyalama engellendi')}}
function documentHTML(){ensure();const p=P[current];return `<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${esc(p.name)}</title><style>body{font-family:Arial,sans-serif;max-width:800px;margin:40px auto;padding:0 22px;color:#111827;line-height:1.6}h1{color:#0b2a63}.box{border:1px solid #ddd;border-radius:14px;padding:18px;margin:12px 0}.label{font-size:12px;color:#667085;font-weight:bold}</style></head><body><h1>${esc(p.name)}</h1><p>${esc(p.desc)}</p>${p.fields.map((f,i)=>`<div class="box"><div class="label">${esc(f)}</div>${esc(values()[i])}</div>`).join('')}<div class="box"><div class="label">SONRAKİ ADIM</div>Bilgileri kontrol edin, gerekli düzenlemeleri yapın ve ilgili kişiyle paylaşın.</div></body></html>`}
function downloadHTML(){const p=P[current],bom='\uFEFF',blob=new Blob([bom+documentHTML()],{type:'text/html;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`${p.name}-${Date.now()}.html`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Belge indirildi')}function printPDF(){ensure();const w=open('','_blank');if(!w){toast('Açılır pencereye izin verin');return}w.document.open();w.document.write(documentHTML());w.document.close();setTimeout(()=>w.print(),300)}async function shareOutput(){try{if(navigator.share)await navigator.share({title:P[current].name,text:plain()});else await copyOutput()}catch{}}
function isStandalone(){return matchMedia('(display-mode:standalone)').matches||navigator.standalone===true}function appEntryUrl(){return new URL('./index.html?source=open-app',location.href).href}function openOrInstall(){if(isStandalone()){toast('Uygulama zaten açık');location.href='./index.html?source=app';return}if(installPrompt){installApp();return}const opened=window.open(appEntryUrl(),'_blank','noopener');if(!opened){location.href=appEntryUrl();return}setTimeout(()=>{if(document.visibilityState==='visible')installApp()},900)}
function installApp(){const modal=$('#installModal'),body=$('#installBody'),native=$('#nativeInstall');modal.classList.add('on');native.style.display='none';const ua=navigator.userAgent.toLowerCase();if(isStandalone()){body.innerHTML='<div class="notice">✓ Uygulama şu anda kurulu uygulama modunda açık.</div>';return}if(installPrompt){body.innerHTML='<p class="muted">Uygulama bu cihazda kurulu görünmüyor. Aşağıdaki düğmeyle sistem kurulum penceresini açın.</p>';native.style.display='inline-block';return}if(/iphone|ipad|ipod/.test(ua))body.innerHTML='<p class="muted"><b>iPhone/iPad:</b> Kurulu uygulama bağlantısı otomatik açılmadıysa Safari’de Paylaş → Ana Ekrana Ekle → Ekle yolunu kullanın.</p>';else if(/android/.test(ua))body.innerHTML='<p class="muted"><b>Android:</b> Kurulu uygulama bağlantısı otomatik açılmadıysa Chrome/Edge menüsünden “Uygulamayı yükle” ya da “Ana ekrana ekle” seçeneğini kullanın.</p>';else body.innerHTML='<p class="muted"><b>Bilgisayar:</b> Kurulu uygulama bağlantısı otomatik açılmadıysa Chrome/Edge adres çubuğundaki uygulama kur simgesini veya “Uygulamayı yükle” seçeneğini kullanın.</p>'}function closeInstall(){$('#installModal').classList.remove('on')}$('#nativeInstall').onclick=async()=>{if(!installPrompt)return;const e=installPrompt;installPrompt=null;await e.prompt();closeInstall()};addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});addEventListener('appinstalled',()=>{installPrompt=null;toast('Kurulum tamamlandı')});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});render();if(new URLSearchParams(location.search).get('source')==='open-app'&&isStandalone())setTimeout(()=>toast('Uygulama açıldı'),250);
</script></body></html>
