name: Update official agriculture prices

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_prices.py"
      - ".github/workflows/update-prices.yml"

permissions:
  contents: write

concurrency:
  group: official-price-update
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests pandas lxml

      - name: Fetch HKS and TOBB prices
        run: python scripts/update_prices.py

      - name: Commit changed price snapshot
        run: |
          git config user.name "tarladan-tabaga-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "Price snapshot unchanged"
            exit 0
          fi
          git commit -m "data: refresh official agriculture prices"
          git push
