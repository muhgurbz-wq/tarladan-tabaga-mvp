name: Jury Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'competition.css'
      - 'competition.js'
      - 'scripts/jury-smoke-test.mjs'
      - 'scripts/jury-network-test.mjs'
      - '.github/workflows/jury-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run jury gates and build evidence
        id: tests
        shell: bash
        run: |
          set +e
          node --check competition.js > syntax.log 2>&1
          SYNTAX=$?
          node scripts/jury-smoke-test.mjs > smoke.log 2>&1
          SMOKE=$?
          node scripts/jury-network-test.mjs > network.log 2>&1
          NETWORK=$?
          cat syntax.log
          cat smoke.log
          cat network.log
          export SYNTAX SMOKE NETWORK
          node - <<'NODE'
          const fs=require('fs');
          const code=n=>Number(process.env[n]||1);
          const gates={syntax:code('SYNTAX')===0,smoke:code('SMOKE')===0,network_assets:code('NETWORK')===0};
          const status=Object.values(gates).every(Boolean)?'PASS':'FAIL';
          const report={
            schema_version:2,
            status,
            tested_commit:process.env.GITHUB_SHA,
            tested_at:new Date().toISOString(),
            node:process.version,
            gates,
            syntax_output:fs.readFileSync('syntax.log','utf8').trim().split('\n').filter(Boolean),
            smoke_output:fs.readFileSync('smoke.log','utf8').trim().split('\n').filter(Boolean),
            network_output:fs.readFileSync('network.log','utf8').trim().split('\n').filter(Boolean),
            note:'Jury evidence is committed on PASS or FAIL; final workflow gate fails if any check fails.'
          };
          fs.mkdirSync('data',{recursive:true});
          fs.writeFileSync('data/jury-test-status.json',JSON.stringify(report,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`overall=${status}\n`);
          NODE
          rm -f syntax.log smoke.log network.log
          exit 0
      - name: Commit jury evidence
        run: |
          git config user.name 'tt-jury-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/jury-test-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: record jury validation evidence'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Final jury gate
        run: test "${{ steps.tests.outputs.overall }}" = "PASS"
