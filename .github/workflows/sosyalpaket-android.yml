name: Build SosyalPaket Android
# rebuild-proof: 2026-09-01

on:
  push:
    branches: [main]
    paths:
      - 'android/sosyalpaket/**'
      - 'experiments/apps/sosyalpaket/**'
      - '.github/workflows/sosyalpaket-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native Android APK
        working-directory: android/sosyalpaket
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare platform package
        run: |
          mkdir -p experiments/downloads
          cp android/sosyalpaket/app/build/outputs/apk/debug/app-debug.apk experiments/downloads/SosyalPaket-Android.apk
          cp experiments/downloads/SosyalPaket-Android.apk SosyalPaket-Android.apk

      - name: Publish APK to platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/downloads/SosyalPaket-Android.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish SosyalPaket Android APK [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SosyalPaket-Android
          path: SosyalPaket-Android.apk
          if-no-files-found: error
          retention-days: 30
