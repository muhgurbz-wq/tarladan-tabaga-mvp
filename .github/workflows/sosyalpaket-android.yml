name: Build SosyalPaket Android

on:
  push:
    branches: [main]
    paths:
      - 'android/sosyalpaket/**'
      - 'experiments/apps/sosyalpaket/**'
      - '.github/workflows/sosyalpaket-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native Android APK
        working-directory: android/sosyalpaket
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare package name
        run: cp android/sosyalpaket/app/build/outputs/apk/debug/app-debug.apk SosyalPaket-Android.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SosyalPaket-Android
          path: SosyalPaket-Android.apk
          if-no-files-found: error
          retention-days: 30
