name: Experiments Smoke Tests
on:
  push:
    branches: [main]
    paths:
      - 'experiments/**'
      - 'tests/experiments-smoke.mjs'
      - 'tests/experiments-browser-smoke.mjs'
      - '.github/workflows/experiments-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static PWA and product checks
        run: node tests/experiments-smoke.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/experiments-http.log 2>&1 &
          sleep 2
      - name: Run real browser smoke tests
        run: node tests/experiments-browser-smoke.mjs
